<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Réponse Express</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=JetBrains+Mono:wght@600&display=swap">
<style>
/* Layout: one narrow column — drop the homework, get a clean answer sheet: answer first, one-line reason, a picture only when it is the answer. */
:root {
  --bg: #0c0f15; --surface: #141923; --surface-2: #1b2130; --line: #283043; --fg: #eaeef5; --muted: #8f99ae;
  --accent: #6ee7b7; --accent-ink: #062b1d; --bad: #ff7b72; --blue: #7aa7ff; --red: #ff7b72; --green: #5fd08a; --orange: #ffa45c; --purple: #b59cff; --ok: #5fd08a;
  --d-ink: #e5e7eb; --d-blue: #7aa7ff; --d-red: #ff7b72; --d-green: #5fd08a; --d-orange: #ffa45c; --d-purple: #b59cff; --d-grey: #6b7280;
  --font-display: "Bricolage Grotesque", "IBM Plex Sans Arabic", system-ui, sans-serif; --font-body: "Atkinson Hyperlegible", "IBM Plex Sans Arabic", system-ui, sans-serif; --font-mono: "JetBrains Mono", ui-monospace, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg: #f4f6fa; --surface: #fff; --surface-2: #f1f4f9; --line: #dde3ec; --fg: #141a26; --muted: #5a6478; --accent: #0f9d6e; --accent-ink: #fff; --bad: #d23c3c; --blue: #2d6ee0; --red: #dc3b3b; --green: #18925a; --orange: #d9700f; --purple: #7547de; --ok: #18925a; --d-ink: #1f2937; --d-blue: #2563eb; --d-red: #dc2626; --d-green: #16a34a; --d-orange: #ea580c; --d-purple: #7c3aed; --d-grey: #9ca3af; color-scheme: light; } }
:root[data-theme="light"] { --bg: #f4f6fa; --surface: #fff; --surface-2: #f1f4f9; --line: #dde3ec; --fg: #141a26; --muted: #5a6478; --accent: #0f9d6e; --accent-ink: #fff; --bad: #d23c3c; --blue: #2d6ee0; --red: #dc3b3b; --green: #18925a; --orange: #d9700f; --purple: #7547de; --ok: #18925a; --d-ink: #1f2937; --d-blue: #2563eb; --d-red: #dc2626; --d-green: #16a34a; --d-orange: #ea580c; --d-purple: #7c3aed; --d-grey: #9ca3af; color-scheme: light; }
:root { --tb-line: var(--line); --tb-card: var(--surface); --tb-bg2: var(--surface-2); --tb-muted: var(--muted); --tb-fg: var(--fg); --tb-accent: var(--accent); --tb-ok: var(--ok); --tb-bad: var(--bad); --tb-blue: var(--blue); --tb-red: var(--red); --tb-green: var(--green); --tb-purple: var(--purple); }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15.5px; line-height: 1.6; }
.wrap { max-width: 720px; margin: 0 auto; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
h1, h2, h3 { font-family: var(--font-display); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.head { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
.head h1 { font-size: 30px; font-weight: 800; } .head h1 span { color: var(--accent); }
.head p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 5px 10px; font-size: 12.5px; font-weight: 700; color: var(--muted); cursor: pointer; }
.seg button + button { border-inline-start: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.drop { border: 2px dashed var(--line); border-radius: 13px; padding: 18px; text-align: center; color: var(--muted); display: grid; gap: 8px; justify-items: center; }
.drop.over { border-color: var(--accent); }
.drop b { color: var(--fg); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 7px 13px; font-weight: 700; font-size: 14px; cursor: pointer; display: inline-flex; gap: 7px; align-items: center; }
.btn:hover:not(:disabled) { border-color: var(--fg); } .btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.go { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-size: 16px; padding: 12px; justify-content: center; border-radius: 12px; }
textarea { width: 100%; min-height: 90px; resize: vertical; border: 1px solid var(--line); background: var(--surface-2); border-radius: 11px; padding: 10px 12px; }
select { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 4px 8px; font-size: 13.5px; }
label.opt { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.pages { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 8px; } .pages:empty { display: none; }
.pg { position: relative; aspect-ratio: 3 / 4; border-radius: 9px; overflow: hidden; border: 1px solid var(--line); background: var(--surface-2); display: grid; place-items: center; font-family: var(--font-mono); font-size: 12px; color: var(--accent); }
.pg img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pg button { position: absolute; top: 3px; inset-inline-end: 3px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: rgb(0 0 0 / .6); color: #fff; font-size: 12px; cursor: pointer; }
.status { display: flex; gap: 10px; align-items: center; color: var(--muted); font-size: 14px; min-height: 20px; } .status.err { color: var(--bad); }
.spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: rot .8s linear infinite; flex: none; }
@keyframes rot { to { transform: rotate(360deg); } }
.sheet { display: grid; gap: 4px; }
.sheet-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.sheet-head h2 { font-size: 20px; }
.ex-t { font-family: var(--font-display); font-size: 15px; color: var(--muted); margin: 14px 0 4px; }
.item { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.item:first-of-type { border-top: 0; }
.lbl { min-width: 30px; height: 26px; padding: 0 6px; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; font-family: var(--font-mono); font-size: 12.5px; color: var(--accent); }
.q { margin: 0; color: var(--muted); font-size: 13.5px; overflow-wrap: anywhere; }
.a { margin: 0; font-size: 17px; font-weight: 700; overflow-wrap: anywhere; }
.why { margin: 0; font-size: 14px; color: var(--muted); overflow-wrap: anywhere; } .why b { color: var(--fg); }
.item .vis { grid-column: 2; margin-top: 6px; }
.note { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); border-radius: 999px; padding: 8px 16px; font-weight: 700; font-size: 14px; z-index: 50; }
/* ---- teaching blocks (shared engine) ---- */
.tb { display: grid; gap: 10px; min-width: 0; }
.tb-text { margin: 0; line-height: 1.75; overflow-wrap: anywhere; }
.tb-card { border: 1px solid var(--tb-line); border-radius: 12px; background: transparent; padding: 10px 12px; display: grid; gap: 8px; min-width: 0; margin: 0; }
.tb-title { font-size: 15px; }
.tb-muted { color: var(--tb-muted); }
.tb-cap { margin: 0; font-size: 13.5px; color: var(--tb-muted); }
.tb-kicker { font-size: 12px; font-weight: 600; color: var(--tb-muted); }
.tb-callout { border-radius: 10px; padding: 8px 12px; border: 0; border-inline-start: 3px solid var(--tb-line); display: grid; gap: 2px; background: transparent !important; }
.tb-key { border-color: var(--tb-accent); }
.tb-tip { border-color: var(--tb-ok); } .tb-tip > b { color: var(--tb-ok); }
.tb-warn { border-color: var(--tb-bad); } .tb-warn > b { color: var(--tb-bad); }
.tb-qq { margin: 0; font-weight: 700; }
.tb-opts { display: grid; gap: 8px; }
.tb-opt { text-align: start; border: 1px solid var(--tb-line); background: var(--tb-bg2); color: inherit; border-radius: 11px; padding: 8px 12px; display: flex; gap: 10px; align-items: center; cursor: pointer; font: inherit; }
.tb-opt:hover:not(:disabled) { border-color: var(--tb-fg); }
.tb-opt.ok { border-color: var(--tb-ok); background: color-mix(in srgb, var(--tb-ok) 14%, transparent); }
.tb-opt.bad { border-color: var(--tb-bad); background: color-mix(in srgb, var(--tb-bad) 14%, transparent); }
.tb-k { width: 22px; height: 22px; border-radius: 6px; background: var(--tb-card); display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; }
.tb-fb p { margin: 4px 0 0; }
.tb-svg svg, .tb-fig svg { width: 100%; max-width: 640px; height: auto; display: block; margin: 0 auto; direction: ltr; }
.tb-math { text-align: center; overflow-x: auto; direction: ltr; font-size: 18px; }
.tb-legend { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; font-size: 13.5px; justify-items: center; }
.tb-legend li { display: flex; gap: 8px; }
.tb-steps { display: grid; gap: 6px; } .tb-steps ol { margin: 0; padding-inline-start: 22px; display: grid; gap: 6px; }
.tb-table { overflow-x: auto; } .tb-table table { border-collapse: collapse; width: 100%; font-size: 14px; } .tb-table th, .tb-table td { border: 1px solid var(--tb-line); padding: 6px 10px; text-align: center; } .tb-table th { background: var(--tb-bg2); }
.tb-tl-tabs { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(64px, 1fr); gap: 6px; overflow-x: auto; }
.tb-tl-tabs button { border: 0; border-radius: 9px; padding: 7px 6px; background: transparent; color: inherit; font: inherit; font-weight: 700; cursor: pointer; }
.tb-tl-tabs button[aria-selected="true"] { background: var(--tb-ok); color: #fff; }
.tb-tl-body { display: grid; gap: 2px; } .tb-tl-body p { margin: 4px 0 0; }
.tb-tl-date { font-size: 26px; font-weight: 800; color: var(--tb-ok); line-height: 1.1; }
.tb-tl-nav { display: flex; justify-content: space-between; gap: 8px; }
.tb-btn { border: 1px solid var(--tb-line); background: var(--tb-bg2); color: inherit; border-radius: 999px; padding: 5px 14px; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; justify-self: center; }
.tb-btn:disabled { opacity: .45; cursor: default; }
.tb-strong { background: var(--tb-fg); color: var(--tb-card); border-color: var(--tb-fg); }
.tb-arrow { text-align: center; color: var(--tb-muted); font-size: 13px; }
.tb-link, .tb-node { border: 1px solid var(--tb-line); border-radius: 11px; padding: 8px 12px; text-align: center; display: grid; gap: 2px; background: var(--tb-bg2); }
.tb-link small, .tb-node small { color: var(--tb-muted); font-size: 12px; }
.tb-direct { border-color: color-mix(in srgb, var(--tb-accent) 55%, var(--tb-line)); }
.tb-possible { border-style: dashed; }
.tb-rel-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.tb-tag { justify-self: center; font-size: 11px; font-weight: 700; color: var(--tb-ok); border: 1px solid color-mix(in srgb, var(--tb-ok) 45%, transparent); border-radius: 6px; padding: 0 6px; }
.tb-model-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tb-live { font-size: 10.5px; font-weight: 800; letter-spacing: .06em; color: var(--tb-ok); border: 1px solid color-mix(in srgb, var(--tb-ok) 45%, transparent); border-radius: 6px; padding: 1px 7px; }
.tb-fig { border-radius: 10px; background: var(--tb-bg2); padding: 6px; }
.tb-ctrls { display: grid; gap: 10px; }
.tb-var { display: grid; gap: 2px; font-size: 14px; } .tb-var-top { display: flex; justify-content: space-between; gap: 8px; } .tb-var input { width: 100%; accent-color: var(--tb-accent); }
.tb-lim { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--tb-muted); }
.tb-outs { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.tb-out { display: grid; gap: 2px; background: var(--tb-bg2); border-radius: 10px; padding: 8px 10px; font-size: 13px; color: var(--tb-muted); } .tb-out b { color: var(--tb-fg); font-size: 18px; }
.tb-num { font-variant-numeric: tabular-nums; }
.tb-plot { width: 100%; height: auto; direction: ltr; } .tb-plot .g { stroke: var(--tb-line); } .tb-plot .ax { stroke: var(--tb-muted); } .tb-plot text { fill: var(--tb-muted); font-size: 12px; }
.tb-plot .c { fill: none; stroke-width: 2.6; } .tb-plot .c0, .tb-keys .c0 { stroke: var(--tb-blue); color: var(--tb-blue); } .tb-plot .c1, .tb-keys .c1 { stroke: var(--tb-red); color: var(--tb-red); } .tb-plot .c2, .tb-keys .c2 { stroke: var(--tb-green); color: var(--tb-green); } .tb-plot .c3, .tb-keys .c3 { stroke: var(--tb-purple); color: var(--tb-purple); }
.tb-keys { display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: center; font-size: 13px; } .tb-keys span { display: inline-flex; gap: 6px; align-items: center; } .tb-keys i { width: 16px; height: 3px; background: currentColor; display: inline-block; border-radius: 2px; } .tb-keys span span { color: var(--tb-fg); }
.tb-follow { display: grid; gap: 6px; } .tb-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.tb-chip { border: 1px solid var(--tb-line); background: transparent; color: inherit; border-radius: 999px; padding: 3px 11px; font: inherit; font-size: 12.5px; cursor: pointer; text-align: start; }
.tb-chip:hover { border-color: var(--tb-accent); }

mjx-container { color: inherit; } mjx-container:not([display="true"]) { display: inline-block; max-width: 100%; overflow-x: auto; vertical-align: middle; }
</style>

<div class="wrap" id="app">
  <header class="head">
    <div><h1>Réponse <span>Express</span></h1><p data-t="sub"></p></div>
    <div class="seg" id="uiSeg"><button type="button" data-l="fr">FR</button><button type="button" data-l="ar">ع</button><button type="button" data-l="en">EN</button></div>
  </header>
  <section class="card" id="input">
    <div class="drop" id="drop"><b data-t="drop"></b><span data-t="types" style="font-size:13px"></span>
      <div class="row" style="justify-content:center"><button class="btn" type="button" id="pick" data-t="choose"></button><button class="btn" type="button" id="cam" data-t="photo"></button></div>
      <input type="file" id="file" multiple hidden accept="image/*,.pdf,.txt"><input type="file" id="camIn" hidden accept="image/*" capture="environment">
    </div>
    <div class="pages" id="pages"></div>
    <textarea id="text" data-tp="paste"></textarea>
    <div class="row">
      <label class="opt"><span data-t="model"></span><select id="model"><option value="haiku">Haiku 5.5</option><option value="sonnet">Sonnet 5.5</option><option value="opus">Opus 5.5</option></select></label>
      <label class="opt"><span data-t="effort"></span><select id="effort"><option value="low" data-t="eLow"></option><option value="medium" data-t="eMed" selected></option><option value="high" data-t="eHigh"></option></select></label>
    </div>
    <button class="btn go" type="button" id="go" data-t="go"></button>
    <div class="status" id="status" aria-live="polite"></div>
  </section>
  <section class="card" id="out" hidden></section>
</div>

<script>
(() => {
  "use strict";
  const UI = {
    sub: ["Ton devoir, résolu de la façon la plus simple. Réponse d'abord, une ligne d'explication.", "واجبك محلول بأبسط طريقة. الجواب أولًا، ثم سطر شرح.", "Your homework, solved the simplest way. Answer first, one line of why."],
    drop: ["Glisse la photo de ton devoir ici", "اسحب صورة واجبك هنا", "Drop a photo of your homework here"], types: ["Photos · PDF · texte · Ctrl+V pour coller", "صور · PDF · نص · Ctrl+V للصق", "Photos · PDF · text · Ctrl+V to paste"],
    choose: ["Choisir", "اختيار", "Choose"], photo: ["Prendre une photo", "التقاط صورة", "Take a photo"], paste: ["…ou colle l'énoncé ici", "…أو الصق النص هنا", "…or paste the questions here"],
    model: ["Modèle", "النموذج", "Model"], effort: ["Réflexion", "التفكير", "Effort"], eLow: ["Rapide", "سريع", "Quick"], eMed: ["Équilibré", "متوازن", "Balanced"], eHigh: ["Approfondi", "معمّق", "Deep"],
    go: ["Répondre", "أجب", "Answer"], working: ["Je résous…", "أحلّ…", "Solving…"], need: ["Ajoute une photo, un PDF ou du texte.", "أضف صورة أو PDF أو نصًا.", "Add a photo, a PDF or text."],
    answers: ["Réponses", "الأجوبة", "Answers"], copy: ["Copier", "نسخ", "Copy"], copied: ["Copié", "نُسخ", "Copied"], again: ["Nouveau devoir", "واجب جديد", "New homework"],
    noAI: ["Claude n'est pas disponible ici. Ouvre la page dans Claude.", "Claude غير متاح هنا. افتح الصفحة داخل Claude.", "Claude isn't available here. Open the page in Claude."],
    err: ["Ça n'a pas marché. Réessaie (ou augmente la réflexion).", "لم ينجح ذلك. أعد المحاولة (أو ارفع مستوى التفكير).", "That didn't work. Try again (or raise the effort)."],
    denied: ["La page n'a pas l'autorisation d'utiliser Claude.", "لم يُسمح للصفحة باستعمال Claude.", "This page isn't allowed to use Claude."], limited: ["Trop de demandes, patiente un peu.", "طلبات كثيرة، انتظر قليلًا.", "Too many requests, wait a bit."],
    key: ["Clé Anthropic API (hors Claude)", "مفتاح Anthropic API (خارج Claude)", "Anthropic API key (outside Claude)"],
  };
  const LANGS = ["fr", "ar", "en"]; let ui = "fr";
  const t = (k) => (UI[k] ? UI[k][LANGS.indexOf(ui)] || UI[k][0] : k);
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null && text !== "") e.textContent = text; return e; };
  const rich = (node, text) => { String(text || "").split(/(\*\*[^*]+\*\*)/).forEach((p) => { if (/^\*\*[^*]+\*\*$/.test(p)) node.append(el("b", null, p.slice(2, -2))); else if (p) node.append(document.createTextNode(p)); }); return node; };
  const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
  const toast = (m) => { const d = el("div", "toast", m); document.body.append(d); setTimeout(() => d.remove(), 1800); };
  const LIB = { mathjax: "https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js", pdf: "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js", pdfWorker: "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js" };
  const loaded = {};
  const loadScript = (u) => loaded[u] || (loaded[u] = new Promise((res, rej) => { const s = document.createElement("script"); s.src = u; s.onload = res; s.onerror = () => { delete loaded[u]; rej(); }; document.head.append(s); }));
  let mj = null;
  function loadMath() { if (!mj) { window.MathJax = { tex: { inlineMath: [["$", "$"]], displayMath: [["$$", "$$"]], processEscapes: true, macros: { vect: ["\\overrightarrow{#1}", 1] } }, svg: { fontCache: "local" }, options: { ignoreHtmlClass: "no-tex" }, startup: { typeset: false } }; mj = loadScript(LIB.mathjax).then(() => window.MathJax.startup.promise).catch((e) => { mj = null; throw e; }); } return mj; }
  async function typeset(nodes) { const l = nodes.filter((n) => n && n.isConnected && n.textContent.includes("$")); if (!l.length) return; try { await loadMath(); window.MathJax.typesetClear(l); await window.MathJax.typesetPromise(l); } catch {} }
