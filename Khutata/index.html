<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>صانع الخطاطات</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700;800&display=swap">
<style>
/* Layout: input desk on top, the generated خطاطة as a framed study sheet with its visuals, then the simple explanation and a question box. */
:root {
  --bg: #eef1f6; --surface: #ffffff; --surface-2: #f6f8fb; --fg: #1d2638; --muted: #5d6779; --line: #d7dde8;
  --navy: #1f3a68; --navy-soft: #e7eefa; --gold: #b8892a; --gold-soft: #fbf5e6; --gold-line: #e6d3a3;
  --concept-a: #eef3fc; --concept-b: #e3ebf8; --concept-line: #b7c7e6;
  --ok: #2f7d4f; --danger: #b3412f;
  --p1-bg: #e9f4ec; --p1-line: #a9d3b6; --p1-fg: #2a7046;
  --p2-bg: #e8eefa; --p2-line: #aebfe3; --p2-fg: #2c4f8c;
  --p3-bg: #fdeedf; --p3-line: #f0c597; --p3-fg: #b45f17;
  --p4-bg: #f1eafa; --p4-line: #cbb6e8; --p4-fg: #6a3f9e;
  --p5-bg: #e5f4f4; --p5-line: #9fd2d2; --p5-fg: #1f6f6f;
  --p6-bg: #fbe9ee; --p6-line: #eab0c0; --p6-fg: #a2385a;
  --d-ink: #1f2937; --d-blue: #2563eb; --d-red: #dc2626; --d-green: #16a34a; --d-orange: #ea580c; --d-purple: #7c3aed; --d-grey: #9ca3af;
  --grid: #e3e8f0; --axis: #475569;
  --font-display: "Noto Kufi Arabic", "IBM Plex Sans Arabic", Tahoma, sans-serif;
  --font-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --font-scripture: "Amiri", "Traditional Arabic", "Times New Roman", serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161f; --surface: #1a202c; --surface-2: #202737; --fg: #e6e9f0; --muted: #a2abbd; --line: #333c4f;
    --navy: #9fb9ea; --navy-soft: #24314b; --gold: #ddb460; --gold-soft: #2a2516; --gold-line: #5a4a24;
    --concept-a: #1f2a40; --concept-b: #1b2538; --concept-line: #3b4d72; --ok: #6cc28f; --danger: #ef8a78;
    --p1-bg: #17291f; --p1-line: #2f5a3e; --p1-fg: #7fd09c; --p2-bg: #1a2438; --p2-line: #34476e; --p2-fg: #9db8ec;
    --p3-bg: #2e2216; --p3-line: #65441f; --p3-fg: #f0a960; --p4-bg: #251d33; --p4-line: #4c3a6b; --p4-fg: #c4a5ef;
    --p5-bg: #152a2a; --p5-line: #2c5a5a; --p5-fg: #7fd3d3; --p6-bg: #2f1a22; --p6-line: #693245; --p6-fg: #f09ab4;
    --d-ink: #e5e7eb; --d-blue: #7aa7ff; --d-red: #ff7b72; --d-green: #5fd08a; --d-orange: #ffa45c; --d-purple: #b59cff; --d-grey: #6b7280;
    --grid: #2a3242; --axis: #a2abbd;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161f; --surface: #1a202c; --surface-2: #202737; --fg: #e6e9f0; --muted: #a2abbd; --line: #333c4f;
  --navy: #9fb9ea; --navy-soft: #24314b; --gold: #ddb460; --gold-soft: #2a2516; --gold-line: #5a4a24;
  --concept-a: #1f2a40; --concept-b: #1b2538; --concept-line: #3b4d72; --ok: #6cc28f; --danger: #ef8a78;
  --p1-bg: #17291f; --p1-line: #2f5a3e; --p1-fg: #7fd09c; --p2-bg: #1a2438; --p2-line: #34476e; --p2-fg: #9db8ec;
  --p3-bg: #2e2216; --p3-line: #65441f; --p3-fg: #f0a960; --p4-bg: #251d33; --p4-line: #4c3a6b; --p4-fg: #c4a5ef;
  --p5-bg: #152a2a; --p5-line: #2c5a5a; --p5-fg: #7fd3d3; --p6-bg: #2f1a22; --p6-line: #693245; --p6-fg: #f09ab4;
  --d-ink: #e5e7eb; --d-blue: #7aa7ff; --d-red: #ff7b72; --d-green: #5fd08a; --d-orange: #ffa45c; --d-purple: #b59cff; --d-grey: #6b7280;
  --grid: #2a3242; --axis: #a2abbd;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.7; }
.wrap {
  max-width: 940px; margin: 0 auto; padding-block: 24px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 20px;
}
h1, h2, h3, h4 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
svg.i { width: 1em; height: 1em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* header */
.app-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand-mark { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--navy); color: var(--surface); font-size: 22px; flex: none; }
.brand h1 { font-size: 22px; color: var(--navy); line-height: 1.3; }
.brand p { margin: 0; color: var(--muted); font-size: 13.5px; }
.head-side { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 3px 11px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button + button { border-inline-start: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--navy); color: var(--surface); }
.seg button:disabled { opacity: .5; cursor: wait; }
.backend-pill { font-size: 12.5px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.backend-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.backend-pill[data-state="ok"] .dot { background: var(--ok); }
.backend-pill[data-state="off"] .dot { background: var(--danger); }

/* desk */
.desk { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: grid; gap: 14px; }
textarea#lessonText { width: 100%; min-height: 130px; resize: vertical; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); padding: 12px 14px; line-height: 1.8; }
.drop { border: 2px dashed var(--line); border-radius: 12px; background: var(--surface-2); padding: 18px 16px; text-align: center; color: var(--muted); display: grid; gap: 8px; justify-items: center; }
.drop.over { border-color: var(--gold); background: var(--gold-soft); }
.drop strong { color: var(--fg); font-weight: 600; font-size: 15.5px; }
.drop .types { font-size: 12.5px; }
.drop .btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.files { display: grid; gap: 8px; }
.files:empty { display: none; }
.file { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; background: var(--surface); }
.file .fic { width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center; background: var(--navy-soft); color: var(--navy); font-size: 18px; flex: none; overflow: hidden; }
.file .fic img { width: 100%; height: 100%; object-fit: cover; }
.file .meta { min-width: 0; flex: 1; display: grid; }
.file .name { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file .info { font-size: 12.5px; color: var(--muted); }
.file .info.err { color: var(--danger); }
.file .x { border: 0; background: transparent; cursor: pointer; color: var(--muted); width: 30px; height: 30px; border-radius: 8px; font-size: 15px; }
.file .x:hover { background: var(--surface-2); color: var(--danger); }
.keybox { display: grid; gap: 8px; padding: 12px; border-radius: 10px; border: 1px solid var(--gold-line); background: var(--gold-soft); font-size: 13px; }
.keyrow { display: flex; gap: 8px; }
.keyrow input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: var(--surface); direction: ltr; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.opts { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.opts label { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.opts select { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 4px 8px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
.btn:hover:not(:disabled) { border-color: var(--navy); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn.primary { background: var(--navy); border-color: var(--navy); color: var(--surface); padding: 10px 22px; font-size: 15px; }
.btn.ghost { background: transparent; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.status { display: flex; align-items: center; gap: 10px; font-size: 13.5px; color: var(--muted); min-height: 22px; }
.status.err { color: var(--danger); }
.spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--navy); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.history { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); }
.history button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 2px 12px; cursor: pointer; font-size: 12.5px; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.history button[aria-current="true"] { border-color: var(--navy); color: var(--navy); font-weight: 600; }

/* result bar */
.result-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.result-bar .tag { font-size: 12.5px; padding: 2px 10px; border-radius: 999px; background: var(--gold-soft); color: var(--gold); border: 1px solid var(--gold-line); }
.tr-label { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }

/* poster */
.poster { background: var(--surface); border: 1.5px solid var(--navy); border-radius: 18px; padding: 8px; }
.poster-inner { border: 1.5px solid var(--gold); border-radius: 13px; padding: 26px clamp(12px, 4vw, 30px) 18px; display: grid; }
.p-head { text-align: center; display: grid; gap: 6px; justify-items: center; margin-bottom: 18px; }
.p-eyebrow { color: var(--gold); font-weight: 700; font-size: 13.5px; display: inline-flex; gap: 8px; align-items: center; font-family: var(--font-display); }
.p-title { font-size: clamp(22px, 5vw, 34px); color: var(--navy); font-weight: 800; line-height: 1.45; }
.p-title .sep { color: var(--gold); }
.p-diamond { width: 9px; height: 9px; background: var(--gold); transform: rotate(45deg); margin-top: 2px; }
.concept { background: linear-gradient(180deg, var(--concept-a), var(--concept-b)); border: 1px solid var(--concept-line); border-radius: 16px; padding: 18px 20px; text-align: center; display: grid; gap: 6px; }
.concept .term { font-family: var(--font-scripture); font-size: clamp(28px, 6vw, 42px); font-weight: 700; color: var(--navy); line-height: 1.5; }
.concept .def { color: var(--muted); font-size: 15px; max-width: 62ch; margin: 0 auto; }
.arrow { display: grid; justify-items: center; color: var(--muted); padding: 6px 0; opacity: .8; }
.arrow svg { width: 18px; height: 26px; }
.sec-head { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 14px; }
.sec-head h3 { font-size: 18px; color: var(--navy); }
.badge { width: 26px; height: 26px; border-radius: 50%; background: var(--navy); color: var(--surface); display: grid; place-items: center; font-size: 13px; font-weight: 700; font-family: var(--font-display); flex: none; }
.badge.ic-badge { background: var(--gold); }
.pillars { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
.pillar { border-radius: 14px; border: 1px solid var(--pl); background: var(--pb); padding: 18px 14px 16px; text-align: center; display: grid; gap: 8px; justify-items: center; align-content: start; min-width: 0; }
.pillar .ic { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--pl); background: var(--surface); color: var(--pf); font-size: 22px; }
.pillar h4 { color: var(--pf); font-size: 17px; }
.pillar p { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.75; }
.c1 { --pb: var(--p1-bg); --pl: var(--p1-line); --pf: var(--p1-fg); }
.c2 { --pb: var(--p2-bg); --pl: var(--p2-line); --pf: var(--p2-fg); }
.c3 { --pb: var(--p3-bg); --pl: var(--p3-line); --pf: var(--p3-fg); }
.c4 { --pb: var(--p4-bg); --pl: var(--p4-line); --pf: var(--p4-fg); }
.c5 { --pb: var(--p5-bg); --pl: var(--p5-line); --pf: var(--p5-fg); }
.c6 { --pb: var(--p6-bg); --pl: var(--p6-line); --pf: var(--p6-fg); }
.checklist { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.check-row { display: flex; gap: 14px; padding: 14px 18px; align-items: flex-start; }
.check-row + .check-row { border-top: 1px dashed var(--line); }
.check-row .tick { width: 28px; height: 28px; border-radius: 50%; background: var(--p1-bg); border: 1px solid var(--p1-line); color: var(--p1-fg); display: grid; place-items: center; flex: none; margin-top: 2px; font-size: 14px; }
.check-row .body, .step .body { min-width: 0; }
.check-row h4 { font-size: 16px; color: var(--navy); margin-bottom: 2px; }
.check-row p { margin: 0; font-size: 14px; }
.steps { display: grid; gap: 10px; }
.step { display: flex; gap: 12px; align-items: flex-start; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.step .num { width: 30px; height: 30px; border-radius: 9px; background: var(--navy-soft); color: var(--navy); display: grid; place-items: center; font-weight: 700; flex: none; font-family: var(--font-display); }
.step h4 { font-size: 15.5px; color: var(--navy); }
.step p { margin: 0; font-size: 14px; color: var(--muted); }
.compare { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.col { border: 1px solid var(--pl); background: var(--pb); border-radius: 14px; padding: 14px 16px; min-width: 0; }
.col h4 { color: var(--pf); font-size: 16px; margin-bottom: 6px; text-align: center; }
.col ul { margin: 0; padding-inline-start: 18px; font-size: 14px; display: grid; gap: 4px; }

/* visuals */
.visuals { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.vis { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 14px; min-width: 0; display: grid; gap: 10px; align-content: start; }
.vis.wide { grid-column: 1 / -1; }
.vis h4 { font-size: 15px; color: var(--navy); text-align: center; }
.vis .cap { margin: 0; font-size: 13.5px; color: var(--muted); text-align: center; }
.formula { text-align: center; font-size: 19px; color: var(--navy); overflow-x: auto; padding: 6px 0; direction: ltr; }
.legend { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 13.5px; }
.legend li { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; justify-content: center; }
.legend .sym { font-weight: 700; color: var(--navy); }
.legend .unit { color: var(--muted); font-size: 12.5px; direction: ltr; unicode-bidi: isolate; }
.plot, .diagram { overflow-x: auto; display: grid; justify-items: center; }
.plot svg, .diagram svg { width: 100%; max-width: 620px; height: auto; direction: ltr; display: block; }
.diagram svg text { font-family: var(--font-body); }
.plot text { font-family: var(--font-body); font-size: 12px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.plot .grid { stroke: var(--grid); stroke-width: 1; }
.plot .axis { stroke: var(--axis); stroke-width: 1.4; }
.plot .curve { fill: none; stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; }
.plot .guide { stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; }
.plot .alabel { fill: var(--fg); font-size: 13px; font-weight: 600; }
.k1 { stroke: var(--d-blue); fill: var(--d-blue); color: var(--d-blue); }
.k2 { stroke: var(--d-red); fill: var(--d-red); color: var(--d-red); }
.k3 { stroke: var(--d-green); fill: var(--d-green); color: var(--d-green); }
.k4 { stroke: var(--d-orange); fill: var(--d-orange); color: var(--d-orange); }
.k5 { stroke: var(--d-purple); fill: var(--d-purple); color: var(--d-purple); }
.kg { stroke: var(--d-grey); fill: var(--d-grey); color: var(--d-grey); }
.plot .curve.k1, .plot .curve.k2, .plot .curve.k3, .plot .curve.k4, .plot .curve.k5, .plot .guide.kg { fill: none; }
.plot text.k1, .plot text.k2, .plot text.k3, .plot text.k4, .plot text.k5, .plot text.kg { stroke: none; font-weight: 600; }
.keys { display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: center; font-size: 13.5px; }
.keys span { display: inline-flex; align-items: center; gap: 6px; }
.keys i { width: 18px; height: 3px; border-radius: 2px; background: currentColor; display: inline-block; }
.tbl { overflow-x: auto; }
.tbl table { border-collapse: collapse; width: 100%; font-size: 14px; }
.tbl th, .tbl td { border: 1px solid var(--line); padding: 6px 10px; text-align: center; }
.tbl th { background: var(--navy-soft); color: var(--navy); font-family: var(--font-display); font-weight: 700; }
.fig img { display: block; max-width: 100%; margin: 0 auto; border-radius: 8px; border: 1px solid var(--line); background: #fff; }
.fig .src { font-size: 12px; color: var(--muted); text-align: center; }

/* evidence */
.evidence { background: var(--gold-soft); border: 1px solid var(--gold-line); border-radius: 16px; padding: 18px 18px 16px; text-align: center; display: grid; gap: 6px; justify-items: center; }
.evidence + .evidence { margin-top: 12px; }
.evidence .label { color: var(--gold); font-weight: 700; font-family: var(--font-display); font-size: 14.5px; display: inline-flex; gap: 8px; align-items: center; }
.evidence .text { font-family: var(--font-scripture); font-size: clamp(22px, 4.6vw, 32px); color: var(--navy); line-height: 1.8; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
.evidence .text.long { font-size: clamp(18px, 3.4vw, 23px); font-weight: 400; }
.evidence .text[lang="ar"] { direction: rtl; }
.evidence .orn { color: var(--gold); font-size: 1.1em; font-weight: 400; }
.evidence .src { color: var(--muted); font-size: 13px; }
.evidence .trans { margin: 0; font-size: 14px; font-style: italic; max-width: 60ch; }
.evidence .sig { margin: 6px 0 0; font-size: 14px; }
.evidence .sig b, .evidence .trans b { color: var(--gold); font-family: var(--font-display); font-weight: 700; font-style: normal; }
.p-foot { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: center; gap: 10px 12px; flex-wrap: wrap; }
.p-foot .k { font-weight: 700; color: var(--navy); font-family: var(--font-display); font-size: 14px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 12px; font-size: 13px; font-weight: 600; background: var(--pb); color: var(--pf); border: 1px solid var(--pl); }
.p-foot .bar { color: var(--line); }

/* explanation */
.explain { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px clamp(16px, 4vw, 26px); display: grid; gap: 18px; }
.ex-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.explain h2 { font-size: 19px; color: var(--navy); display: flex; align-items: center; gap: 10px; }
.explain h3 { font-size: 15.5px; color: var(--navy); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.explain p { margin: 0; max-width: 68ch; }

      if (c === "\t") { out += "\\t"; continue; }
      if (c === "\\") {
