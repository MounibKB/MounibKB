<style>
/* Layout: one guide sheet, like a printed "how to draw" poster — final result + tools + palette on top,
   numbered step cards in a grid, tips at the bottom. One viewer opens on click. */
:root {
  --paper: #f7f3ea; --card: #fffdf8; --ink: #22201c; --muted: #6f685c; --line: #e3dccd;
  --red: #c8323a; --red-ink: #fff; --yellow: #f2c94c; --green: #2f8f5b; --blue: #2f6db3;
  --font-d: "Fraunces", "Readex Pro", Georgia, serif; --font-b: "Atkinson Hyperlegible", "Readex Pro", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper: #17150f; --card: #211e17; --ink: #f1ece1; --muted: #a59d8c; --line: #3a3529; --red: #e0545b; --yellow: #e6be4a; --green: #57b884; --blue: #6ea3e0; color-scheme: dark; } }
:root[data-theme="dark"] { --paper: #17150f; --card: #211e17; --ink: #f1ece1; --muted: #a59d8c; --line: #3a3529; --red: #e0545b; --yellow: #e6be4a; --green: #57b884; --blue: #6ea3e0; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-b); font-size: 15px; line-height: 1.55; }
[dir="rtl"] body, [dir="rtl"] { font-family: "Readex Pro", var(--font-b); }
h1, h2, h3 { font-family: var(--font-d); margin: 0; text-wrap: balance; }
[dir="rtl"] h1, [dir="rtl"] h2, [dir="rtl"] h3 { font-family: "Readex Pro", sans-serif; font-weight: 700; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.wrap { max-width: 1100px; margin: 0 auto; padding-block: 18px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.logo { font-family: var(--font-d); font-size: 22px; font-weight: 800; } .logo b { color: var(--red); }
.top-r { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 7px 12px; font-weight: 700; font-size: 14px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.btn:hover:not(:disabled) { border-color: var(--ink); } .btn:disabled { opacity: .5; cursor: default; }
.btn.red { background: var(--red); color: var(--red-ink); border-color: var(--red); }
select { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 6px 8px; font-size: 14px; }
.settings { position: relative; }
.settings > summary { list-style: none; cursor: pointer; } .settings > summary::-webkit-details-marker { display: none; }
.pop { position: absolute; inset-inline-end: 0; top: 44px; z-index: 20; width: 280px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; box-shadow: 0 12px 30px rgb(0 0 0 / .15); }
.pop label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 700; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 6px 4px; font-size: 13px; font-weight: 700; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
input[type=range] { width: 100%; accent-color: var(--red); }
/* upload */
.drop { border: 2px dashed var(--line); border-radius: 20px; background: var(--card); padding: 42px 20px; display: grid; gap: 12px; justify-items: center; text-align: center; }
.drop.over { border-color: var(--red); }
.drop h2 { font-size: clamp(24px, 4vw, 34px); }
.drop p { margin: 0; color: var(--muted); max-width: 46ch; }
.status { display: flex; gap: 10px; align-items: center; justify-content: center; color: var(--muted); min-height: 22px; font-size: 14px; }
.status.err { color: var(--red); }
.spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--red); animation: rot .8s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }
/* sheet */
.banner { display: inline-block; background: var(--ink); color: var(--paper); font-family: var(--font-d); font-weight: 800; font-size: clamp(22px, 3.6vw, 32px); padding: 4px 16px; border-radius: 6px; transform: rotate(-1deg); }
.sub { display: inline-block; background: var(--yellow); color: #1d1a12; font-weight: 700; padding: 2px 12px; border-radius: 4px; margin-top: 8px; transform: rotate(.6deg); }
.hero { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 860px) { .hero { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); align-items: start; } }
.final { position: relative; border-radius: 14px; overflow: hidden; border: 3px solid var(--ink); background: var(--card); }
.final img { display: block; width: 100%; height: auto; }
.tag { position: absolute; top: 10px; inset-inline-start: 10px; background: var(--red); color: var(--red-ink); font-weight: 700; padding: 3px 12px; border-radius: 8px; font-size: 14px; }
.side { display: grid; gap: 14px; }
.box { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 8px; }
.box h3 { font-size: 16px; }
.kick { display: inline-block; background: var(--red); color: var(--red-ink); font-weight: 700; font-size: 13.5px; padding: 2px 10px; border-radius: 7px; justify-self: start; }
.tools { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.tools label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
.tools input { accent-color: var(--green); width: 17px; height: 17px; }
.pal { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.sw { display: grid; justify-items: center; gap: 2px; font-size: 12px; text-align: center; color: var(--muted); }
.sw i { width: 100%; height: 26px; border-radius: 13px 4px 13px 4px; display: block; border: 1px solid rgb(0 0 0 / .08); }
.steps { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.step { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px; display: grid; gap: 8px; cursor: pointer; text-align: start; position: relative; min-width: 0; }
.step:hover { border-color: var(--ink); }
.step-h { display: flex; gap: 8px; align-items: center; }
.num { width: 30px; height: 30px; border-radius: 50%; background: var(--red); color: var(--red-ink); display: grid; place-items: center; font-weight: 800; flex: none; font-family: var(--font-d); }
.step-h b { font-size: 15px; }
.done-t { margin-inline-start: auto; color: var(--green); font-weight: 800; }
.thumb { border-radius: 8px; overflow: hidden; border: 1px solid var(--line); background: #fff; aspect-ratio: var(--ar, 16 / 9); }
.thumb canvas { width: 100%; height: 100%; display: block; object-fit: contain; }
.cap { margin: 0; font-size: 14px; text-align: center; }
.bottom { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 760px) { .bottom { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); } }
.tips { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.tips li::before { content: "✔ "; color: var(--red); font-weight: 800; }
.note { background: var(--ink); color: var(--paper); border-radius: 14px; padding: 12px 16px; display: grid; gap: 4px; align-content: center; }
.note b { color: var(--yellow); }
.links { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.honest { font-size: 12.5px; color: var(--muted); text-align: center; margin: 0; }
/* viewer */
.ov { position: fixed; inset: 0; z-index: 50; background: rgb(15 13 9 / .82); display: grid; place-items: center; padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.vw { width: min(1100px, 100%); max-height: 100%; overflow: auto; background: var(--card); border-radius: 16px; padding: 12px; display: grid; gap: 10px; }
.vw-h { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.vw-h h3 { font-size: 18px; flex: 1; min-width: 0; }
.stage { position: relative; overflow: hidden; border-radius: 10px; border: 1px solid var(--line); background: #fff; touch-action: none; cursor: grab; }
.stage canvas { display: block; width: 100%; height: auto; transform-origin: 0 0; }
.stage .orig { position: absolute; inset: 0; clip-path: inset(0 0 0 var(--cut, 100%)); }
.cmp-line { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--red); left: var(--cutp, 100%); pointer-events: none; }
.vw-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.vw-tools label { display: inline-flex; gap: 6px; align-items: center; font-size: 13.5px; font-weight: 700; }
.vw-tools input[type=range] { width: 160px; }
.detail { display: grid; gap: 6px; font-size: 14.5px; }
.detail p { margin: 0; } .detail b { color: var(--red); }
.region-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.region-chips button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
</style>

<div class="wrap" id="app">
  <header class="top">
    <div class="logo">✏️ Draw<b>Master</b></div>
    <div class="top-r">
      <select id="lang" aria-label="Language"><option value="en">English</option><option value="fr">Français</option><option value="ar">العربية</option></select>
      <details class="settings"><summary class="btn" id="setBtn">⚙ AI</summary>
        <div class="pop">
          <label><span data-t="model"></span><div class="seg" id="model"><button type="button" data-m="haiku">Haiku 5.5</button><button type="button" data-m="sonnet">Sonnet 5.5</button><button type="button" data-m="opus">Opus 5.5</button></div></label>
          <label><span><span data-t="effort"></span>: <b id="effLbl"></b></span><input type="range" id="effort" min="0" max="2" step="1"></label>
          <button class="btn" type="button" id="redo" data-t="redo"></button>
          <small id="aiState" style="color:var(--muted)"></small>
        </div>
      </details>
      <button class="btn" id="newBtn" type="button" hidden data-t="newImg"></button>
    </div>
  </header>

  <section class="drop" id="drop">
    <h2 data-t="upTitle"></h2>
    <p data-t="upText"></p>
    <div class="links"><button class="btn red" type="button" id="pick" data-t="choose"></button><button class="btn" type="button" id="cam" data-t="camera"></button></div>
    <input type="file" id="file" accept="image/*" hidden><input type="file" id="camIn" accept="image/*" capture="environment" hidden>
    <div class="status" id="status" aria-live="polite"></div>
  </section>

  <section id="sheet" hidden style="display:grid;gap:18px"></section>
</div>
<div id="ovl"></div>

  const saveStep = (i) => saveCanvas(stepCanvas(S.steps[i], 2), `drawmaster-step-${i + 1}-${S.steps[i].id}.png`).catch(() => {});
  async function downloadAll() { for (let i = 0; i < S.steps.length; i++) { try { await saveStep(i); } catch { break; } } }

  /* ---------------- Claude (vision) personalisation ---------------- */
  function parseJson(text) {
    const tr = String(text).trim(); const tries = [tr]; const f = tr.match(/```(?:json)?\s*([\s\S]*?)```/); if (f) tries.push(f[1]); const a = tr.indexOf("{"), b = tr.lastIndexOf("}"); if (a >= 0 && b > a) tries.push(tr.slice(a, b + 1));
    for (const c of tries) { try { return JSON.parse(c); } catch {} try { return JSON.parse(c.replace(/\\(?!["\\/bfnrtu])/g, "\\\\").replace(/,\s*([}\]])/g, "$1")); } catch {} }
    throw new Error("json");
  }
  async function jpeg() { const c = document.createElement("canvas"); const im = new Image(); im.src = S.img; await im.decode(); const sc = Math.min(1, 1400 / Math.max(im.width, im.height)); c.width = im.width * sc; c.height = im.height * sc; c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); return new Promise((r) => c.toBlob(r, "image/jpeg", 0.88)); }
  async function personalise() {
    if (!S.sample || !S.an) return;
    const ln = { en: "English", fr: "French", ar: "Arabic" }[lang];
    const ids = S.steps.map((s) => s.id);
    const prompt = `You are a warm, expert drawing teacher. The image is what the student wants to draw with coloured pencils. A program has already computed ${S.steps.length} step images from it (${ids.join(", ")}): sketch = light construction, lines = clean outlines, background = background base colours, colors = main colours, shading = shadows/gradients/texture, final = highlights and details. Region data computed from the pixels: ${JSON.stringify(DMEngine.summary(S.an)).slice(0, 7000)}
Write a SHORT, concrete guide for THIS picture in ${ln}. Keep it simple and organised like a printed "how to draw" poster: each caption ≤ 14 words, each detail ≤ 18 words; name real objects and places in the picture ("the rocks on the left", "the sky near the horizon").
Reply ONLY JSON: {"title":"short name of the scene","steps":{${ids.map((k) => `"${k}":{"title":"2–4 words","caption":"…","where":"…","how":"…","tools":"…","avoid":"…"}`).join(",")}},"materials":["4–7 items"],"colors":[{"hex":"#rrggbb from the region data","name":"plain colour name"}],"tips":["5 short pro secrets"],"note":"one encouraging line","regionRoles":[{"id":0,"role":"background|foreground|secondary|detail"}]}
regionRoles: only for ids in the region data whose role is clearly wrong (e.g. the sky marked foreground). colors: 6–8 colours from the image.`;
    const m = MODELS[S.model];
    const sheet = $("sheet"); const st = el("div", "status"); st.append(el("span", "spin"), document.createTextNode(T().aiWorking)); sheet.prepend(st);
    try {
      const r = await S.sample(prompt, { model: m[0], modelTier: m[1], effort: ["low", "medium", "high"][S.effort], images: [await jpeg()], cache: false });
      const d = parseJson(r.text);
      const valid = new Set(S.an.regions.map((x) => x.id));
      (Array.isArray(d.regionRoles) ? d.regionRoles : []).forEach((x) => { const rg = S.an.regions.find((q) => q.id === +x.id); if (rg && valid.has(rg.id) && rg.roleSource !== "user" && ["background", "foreground", "secondary", "detail"].includes(x.role)) DMEngine.setRole(S.an, rg.id, x.role, "ai"); });
      S.plan = DMEngine.planStages(S.an); buildSteps(); thumbsReset();
      S.ai = { title: String(d.title || "").slice(0, 80), steps: d.steps && typeof d.steps === "object" ? d.steps : {}, materials: (d.materials || []).map(String).slice(0, 8), colors: (d.colors || []).filter((c) => c && /^#[0-9a-f]{6}$/i.test(c.hex)).map((c) => ({ hex: c.hex, name: String(c.name || "").slice(0, 24) })).slice(0, 8), tips: (d.tips || []).map(String).slice(0, 6), note: String(d.note || "").slice(0, 140) };
      S.aiModel = r.modelApplied ? m[2] : ({ quick: "Haiku", default: "Sonnet", complex: "Opus" }[r.modelTierApplied] || m[2]);
    } catch (e) { const n = el("p", "honest", T().aiErr); setTimeout(() => sheet.prepend(n), 0); }
    finally { st.remove(); renderSheet(); paintSettings(); }
  }
  S.sampleReady = (async () => { if (window.claude && window.claude.use) { try { S.sample = await window.claude.use("sample"); } catch { S.sample = null; } } paintSettings(); })();

  applyLang();
  window.__dm = { S, openViewer, openFix, renderSheet };
})();
