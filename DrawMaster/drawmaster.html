/* Layout: a dark "how to draw" poster — title ribbons, final result + tools, numbered step panels
   with ribbon titles and one-line captions, palette, pro secrets, last note. Single dark look by design. */
:root {
  --bg: #0f0f10; --panel: #18181a; --panel-2: #222225; --line: #2c2c30; --fg: #f3efe6; --muted: #a8a299;

  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--font-b); font-size: 15px; line-height: 1.55; }
[dir="rtl"] .ttl, [dir="rtl"] h1, [dir="rtl"] h2, [dir="rtl"] .rib { font-family: "Lalezar", var(--font-d); letter-spacing: 0; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--yellow); outline-offset: 2px; }
.wrap { max-width: 1080px; margin: 0 auto; padding-block: 16px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.logo { font-family: var(--font-d); font-size: 20px; } .logo b { color: var(--red); }
.bar-r { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 7px 12px; font-weight: 700; font-size: 14px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; color: var(--fg); }
.btn:hover:not(:disabled) { border-color: var(--fg); } .btn:disabled { opacity: .45; cursor: default; }
.btn.red { background: var(--red); border-color: var(--red); color: #fff; }
select { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 6px 8px; font-size: 14px; }
details.ai { position: relative; } details.ai > summary { list-style: none; } details.ai > summary::-webkit-details-marker { display: none; }
.pop { position: absolute; inset-inline-end: 0; top: 44px; z-index: 30; width: 280px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; box-shadow: 0 14px 34px rgb(0 0 0 / .5); }
.pop label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 700; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 6px 4px; font-size: 13px; font-weight: 700; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
input[type=range] { width: 100%; accent-color: var(--red); }
/* upload */
.drop { border: 2px dashed var(--line); border-radius: 18px; background: var(--panel); padding: 48px 20px; display: grid; gap: 12px; justify-items: center; text-align: center; }
.drop.over { border-color: var(--yellow); }
.drop h1 { font-family: var(--font-d); font-size: clamp(26px, 4.6vw, 40px); line-height: 1.1; margin: 0; }
.drop p { margin: 0; color: var(--muted); max-width: 48ch; }
.status { display: flex; gap: 10px; align-items: center; justify-content: center; color: var(--muted); min-height: 22px; font-size: 14px; }
.status.err { color: #ff8a8a; }
.spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--yellow); animation: rot .8s linear infinite; flex: none; }
@keyframes rot { to { transform: rotate(360deg); } }
/* poster */
.poster { display: grid; gap: 14px; }
.head { display: grid; gap: 8px; justify-items: center; text-align: center; }
.ttl { font-family: var(--font-d); font-size: clamp(24px, 4.4vw, 40px); line-height: 1.15; margin: 0; background: #050505; color: #fff; padding: 6px 22px 8px; border-radius: 4px 14px 6px 16px; transform: rotate(-1deg); box-shadow: 0 0 0 3px #050505, 0 6px 0 -1px var(--red); }
.hl { font-family: var(--font-d); font-size: clamp(22px, 3.8vw, 34px); color: #111; background: var(--yellow); padding: 2px 18px 4px; border-radius: 10px 3px 12px 4px; transform: rotate(.8deg); }
.tag2 { background: #050505; color: #fff; padding: 3px 16px; border-radius: 4px; font-weight: 700; font-size: 15px; transform: rotate(-.6deg); }
.top { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 820px) { .top { grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); align-items: start; } }
.final { position: relative; border: 4px solid #050505; border-radius: 8px; overflow: hidden; background: var(--paper); box-shadow: 0 0 0 1px var(--line); }
.final img { display: block; width: 100%; height: auto; }
.crown { position: absolute; top: 10px; inset-inline-start: 10px; background: var(--red); color: #fff; font-weight: 800; padding: 4px 14px; border-radius: 8px; font-size: 15px; box-shadow: 0 3px 0 rgb(0 0 0 / .4); }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; align-content: start; }
.rib { justify-self: start; background: var(--red); color: #fff; font-weight: 800; font-size: 15px; padding: 3px 14px; border-radius: 8px 3px 8px 3px; }
[dir="rtl"] .rib { justify-self: start; }
.tools { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.tools label { display: flex; gap: 10px; align-items: center; cursor: pointer; font-size: 15.5px; }
.tools input { appearance: none; width: 20px; height: 20px; border: 2px solid var(--muted); border-radius: 5px; display: grid; place-items: center; cursor: pointer; flex: none; }
.tools input:checked { border-color: #3ccf7a; } .tools input:checked::after { content: "✓"; color: #3ccf7a; font-weight: 900; font-size: 15px; line-height: 1; }
.steps { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.st { position: relative; background: var(--panel); border: 1.5px solid #3550a8; border-radius: 10px; padding: 34px 10px 12px; display: grid; gap: 8px; cursor: pointer; text-align: center; color: var(--fg); min-width: 0; }
.st:hover { border-color: var(--yellow); }
.st .n { position: absolute; top: -10px; inset-inline-start: -8px; width: 38px; height: 38px; border-radius: 50%; background: var(--red); color: #fff; border: 3px solid var(--bg); display: grid; place-items: center; font-family: var(--font-d); font-size: 18px; }
.st .rib { position: absolute; top: 6px; left: 50%; transform: translateX(-50%); white-space: nowrap; max-width: calc(100% - 60px); overflow: hidden; text-overflow: ellipsis; font-size: 14.5px; }
.st .img { border-radius: 4px; overflow: hidden; background: var(--paper); aspect-ratio: var(--ar, 16/9); border: 1px solid #000; }
.st canvas { width: 100%; height: 100%; display: block; }
.st p { margin: 0; font-size: 14px; line-height: 1.5; }
.st .ok { position: absolute; top: 6px; inset-inline-end: 8px; color: #3ccf7a; font-weight: 900; }
.bottom { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 760px) { .bottom { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.secrets { background: var(--pink); border-color: #5a2a35; }
.secrets ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
.secrets li { display: flex; gap: 8px; } .secrets li::before { content: "☑"; color: var(--red); font-weight: 900; }
.pal { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 8px; }
.sw { display: grid; justify-items: center; gap: 4px; font-size: 12.5px; color: var(--muted); text-align: center; }
.sw i { width: 100%; height: 30px; display: block; border-radius: 40% 60% 45% 55% / 60% 40% 60% 40%; transform: rotate(-8deg); box-shadow: inset 0 0 0 3px rgb(255 255 255 / .12); }
.note { background: #050505; border-radius: 30px; padding: 12px 20px; display: flex; gap: 14px; align-items: center; justify-content: center; text-align: center; border: 1px solid var(--line); }
.note b { color: var(--yellow); display: block; }
.links { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.honest { margin: 0; font-size: 12.5px; color: var(--muted); text-align: center; }
/* viewer */
.ov { position: fixed; inset: 0; z-index: 60; background: rgb(0 0 0 / .85); display: grid; place-items: center; padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.vw { width: min(1040px, 100%); max-height: 100%; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: grid; gap: 10px; }
.vw-h { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.vw-h .n2 { width: 34px; height: 34px; border-radius: 50%; background: var(--red); color: #fff; display: grid; place-items: center; font-family: var(--font-d); flex: none; }
.vw-h h2 { margin: 0; font-size: 19px; flex: 1; min-width: 0; font-family: var(--font-d); font-weight: 400; }
.stage { position: relative; overflow: hidden; border-radius: 8px; background: var(--paper); touch-action: none; cursor: grab; }
.stage canvas { display: block; width: 100%; height: auto; transform-origin: 0 0; }
.stage .orig { position: absolute; inset: 0; clip-path: inset(0 0 0 var(--cut, 100%)); }
.cmp-line { position: absolute; top: 0; bottom: 0; width: 3px; background: var(--yellow); left: var(--cut, 100%); pointer-events: none; }
.vw-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.vw-tools label { display: inline-flex; gap: 6px; align-items: center; font-size: 13.5px; font-weight: 700; }
.vw-tools input[type=range] { width: 150px; }
.cap2 { margin: 0; font-size: 16px; font-weight: 600; }
.det { display: grid; gap: 4px; font-size: 14.5px; color: var(--muted); } .det p { margin: 0; } .det b { color: var(--yellow); }
.areas { display: flex; gap: 6px; flex-wrap: wrap; }
.areas button[aria-pressed="true"] { border-color: var(--yellow); }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
</style>

          <label><span><span data-t="effort"></span>: <b id="effLbl"></b></span><input type="range" id="effort" min="0" max="2" step="1"></label>

  <section class="drop" id="drop">

    <div class="status" id="status" aria-live="polite"></div>

  <section class="poster" id="poster" hidden></section>
</div>

  const cache = {};

  /* ---------- text for a step (AI first, generic fallback) ---------- */
  const kindOf = (s) => s.kind || (String(s.key).startsWith("color") ? "color" : s.key);
  function areaOf(s) { return s.areaId != null ? S.il.areas.find((a) => a.id === s.areaId) : null; }
  function stepText(i) {
    const s = S.il.steps[i], k = kindOf(s), g = T().st[k] || T().st.final, a = areaOf(s);
    const ai = S.ai && S.ai.steps && S.ai.steps[s.key];
    const aname = (S.ai && S.ai.areas && a && S.ai.areas[a.id]) || (a ? a.position : "");
    const fill = (x) => String(x).replace(/\{area\}/g, aname || "").replace(/\{color\}/g, a ? a.colorName : "").replace(/\{pos\}/g, a ? a.position : "");
    return { title: (ai && ai.title) || fill(g[0]), caption: (ai && ai.caption) || fill(g[1]), where: (ai && ai.where) || fill(g[2]), how: (ai && ai.how) || fill(g[3]), tools: (ai && ai.tools) || fill(g[4]), avoid: (ai && ai.avoid) || fill(g[5]) };
  }

  /* ---------- settings ---------- */
  function paintAI() {
    $("model").querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.m === S.model)));
    $("effort").value = S.effort; $("effLbl").textContent = T().eff[S.effort];
    $("redo").hidden = !(S.sample && S.an); $("aiState").textContent = S.sample ? (S.aiModel ? `${T().aiBy} ${S.aiModel}` : "") : T().generic;
  }
  $("model").onclick = (e) => { const b = e.target.closest("button[data-m]"); if (!b) return; S.model = b.dataset.m; store.set("dm.model", S.model); paintAI(); };
  $("effort").oninput = () => { S.effort = +$("effort").value; store.set("dm.effort", S.effort); paintAI(); };
  $("redo").onclick = () => { $("aiBox").open = false; personalise(); };
  $("lang").onchange = () => { lang = $("lang").value; store.set("dm.lang", lang); applyLang(); if (S.il) { renderPoster(); if (S.sample) personalise(); } };
  function applyLang() { document.documentElement.lang = lang; $("app").dir = lang === "ar" ? "rtl" : "ltr"; $("lang").value = lang; document.querySelectorAll("[data-t]").forEach((n) => (n.textContent = T()[n.dataset.t])); paintAI(); }

  /* ---------- upload ---------- */
  const status = (m, busy, err) => { const s = $("status"); s.replaceChildren(); s.className = "status" + (err ? " err" : ""); if (busy) s.append(el("span", "spin")); if (m) s.append(document.createTextNode(m)); };
  $("pick").onclick = () => $("file").click(); $("cam").onclick = () => $("camIn").click();
  $("file").onchange = (e) => load(e.target.files[0]); $("camIn").onchange = (e) => load(e.target.files[0]);
  ["dragenter", "dragover"].forEach((v) => $("drop").addEventListener(v, (e) => { e.preventDefault(); $("drop").classList.add("over"); }));
  ["dragleave", "drop"].forEach((v) => $("drop").addEventListener(v, (e) => { e.preventDefault(); $("drop").classList.remove("over"); }));
  $("drop").addEventListener("drop", (e) => load(e.dataTransfer.files[0]));
  document.addEventListener("paste", (e) => { const f = Array.from((e.clipboardData && e.clipboardData.items) || []).find((i) => i.kind === "file"); if (f) load(f.getAsFile()); });
  $("newBtn").onclick = () => { $("poster").hidden = true; $("drop").hidden = false; $("newBtn").hidden = true; status(""); };
  async function load(file) {
    if (!file || !/^image\//.test(file.type)) return;
    status(T().working, true);
    try {
      const url = URL.createObjectURL(file); const img = new Image(); img.src = url; await img.decode();
      await new Promise((r) => setTimeout(r, 30));
      S.an = DMEngine.analyze(DMEngine.prepare(img, { maxSide: 900 }));
      await new Promise((r) => setTimeout(r, 10));
      S.il = DMEngine.illustrate(S.an, { maxAreas: 7 });
      S.img = url; S.ai = null; S.aiModel = ""; Object.keys(cache).forEach((k) => delete cache[k]);
      $("drop").hidden = true; $("poster").hidden = false; $("newBtn").hidden = false; status("");
      renderPoster(); window.scrollTo({ top: 0 });
      await S.ready; if (S.sample) personalise();
    } catch (e) { console.error(e); status(T().err, false, true); }
  }

  /* ---------- poster ---------- */
  const stepCanvas = (i, scale = 1) => DMEngine.renderIllus(S.an, S.il, i, { scale });
  const thumb = (i) => (cache[i] || (cache[i] = stepCanvas(i, 0.6)));
  const copy = (src) => { const c = document.createElement("canvas"); c.width = src.width; c.height = src.height; c.getContext("2d").drawImage(src, 0, 0); return c; };
  function renderPoster() {
    const t = T(), P = $("poster"); P.replaceChildren(); P.style.setProperty("--ar", `${S.an.width} / ${S.an.height}`);
    const head = el("div", "head"); head.append(el("h1", "ttl", t.title)); head.append(el("div", "hl", (S.ai && S.ai.title) || "")); if (!(S.ai && S.ai.title)) head.lastChild.remove(); head.append(el("div", "tag2", t.with)); P.append(head);
    const top = el("div", "top");
    const fin = el("div", "final"); const im = el("img"); im.src = S.img; im.alt = t.final; fin.append(im, el("span", "crown", "👑 " + t.final)); top.append(fin);
    const tb = el("div", "box"); tb.append(el("span", "rib", t.tools)); const ul = el("ul", "tools");
    ((S.ai && S.ai.materials && S.ai.materials.length) ? S.ai.materials : t.materials).slice(0, 7).forEach((m) => { const li = el("li"), lb = el("label"), cb = el("input"); cb.type = "checkbox"; cb.checked = !!S.tools[m]; cb.onchange = () => { S.tools[m] = cb.checked; store.set("dm.tools", S.tools); }; lb.append(cb, document.createTextNode(m)); li.append(lb); ul.append(li); });
    tb.append(ul); top.append(tb); P.append(top);
    const grid = el("div", "steps");
    S.il.steps.forEach((s, i) => {
      const tx = stepText(i); const c = el("button", "st"); c.type = "button"; c.setAttribute("aria-label", `${i + 1}. ${tx.title}`);
      c.append(el("span", "n", String(i + 1)), el("span", "rib", tx.title)); if (S.done[s.key]) c.append(el("span", "ok", "✓"));
      const box = el("div", "img"); box.append(copy(thumb(i))); c.append(box, el("p", null, tx.caption)); c.onclick = () => openViewer(i); grid.append(c);
    });
    P.append(grid);
    const bot = el("div", "bottom");
    const sec = el("div", "box secrets"); sec.append(el("span", "rib", "💡 " + t.secrets)); const sl = el("ul"); ((S.ai && S.ai.tips && S.ai.tips.length) ? S.ai.tips : t.tips).slice(0, 5).forEach((x) => sl.append(el("li", null, x))); sec.append(sl); bot.append(sec);
    const pb = el("div", "box"); pb.append(el("span", "rib", "🎨 " + t.palette)); const pal = el("div", "pal");
    const cols = (S.ai && S.ai.colors && S.ai.colors.length) ? S.ai.colors : S.il.areas.map((a) => ({ hex: a.hex, name: a.colorName }));
    const seen = new Set(); cols.filter((c) => !seen.has(c.hex) && seen.add(c.hex)).slice(0, 8).forEach((c) => { const s = el("div", "sw"), i = el("i"); i.style.background = c.hex; s.append(i, el("span", null, c.name)); pal.append(s); });
    pb.append(pal); bot.append(pb); P.append(bot);
    const note = el("div", "note"); const nt = el("div"); nt.append(el("b", null, "⭐ " + t.noteT), el("span", null, (S.ai && S.ai.note) || t.note)); note.append(nt); P.append(note);
    const links = el("div", "links"); const fx = el("button", "btn", "↕ " + t.fix); fx.type = "button"; fx.onclick = openFix; const da = el("button", "btn", "⬇ " + t.dlAll); da.type = "button"; da.onclick = downloadAll; links.append(fx, da); P.append(links);
    P.append(el("p", "honest", t.honest + " " + (S.sample ? (S.aiModel ? `${t.aiBy} ${S.aiModel}.` : "") : t.generic)));
  }

  /* ---------- viewer ---------- */
  function openViewer(i) {
    const t = T(), s = S.il.steps[i], tx = stepText(i), ov = $("ovl"); ov.replaceChildren();
    const back = el("div", "ov"), vw = el("div", "vw"); vw.dir = lang === "ar" ? "rtl" : "ltr"; vw.setAttribute("role", "dialog"); vw.setAttribute("aria-modal", "true");
    const close = () => { ov.replaceChildren(); document.removeEventListener("keydown", key); };
    const go = (d) => { const j = i + d; if (j >= 0 && j < S.il.steps.length) { close(); openViewer(j); } };
    const key = (e) => { if (e.key === "Escape") close(); if (e.key === "ArrowRight") go(lang === "ar" ? -1 : 1); if (e.key === "ArrowLeft") go(lang === "ar" ? 1 : -1); };
    document.addEventListener("keydown", key); back.onclick = (e) => { if (e.target === back) close(); };
    const h = el("div", "vw-h"); h.append(el("span", "n2", String(i + 1)), el("h2", null, tx.title));
    const pv = el("button", "btn", t.prev); pv.type = "button"; pv.disabled = i === 0; pv.onclick = () => go(-1);
    const nx = el("button", "btn", t.next); nx.type = "button"; nx.disabled = i === S.il.steps.length - 1; nx.onclick = () => go(1);
    const cl = el("button", "btn", "✕"); cl.type = "button"; cl.onclick = close; h.append(pv, nx, cl); vw.append(h);
    const stage = el("div", "stage"), base = stepCanvas(i), orig = document.createElement("canvas"); orig.width = base.width; orig.height = base.height; orig.className = "orig";
    const oi = new Image(); oi.onload = () => orig.getContext("2d").drawImage(oi, 0, 0, orig.width, orig.height); oi.src = S.img;
    const line = el("div", "cmp-line"); line.hidden = true; stage.append(base, orig, line);
    let z = 1, px = 0, py = 0, drag = null; const apply = () => [base, orig].forEach((c) => (c.style.transform = `translate(${px}px,${py}px) scale(${z})`));
    stage.addEventListener("wheel", (e) => { e.preventDefault(); z = Math.min(6, Math.max(1, z * (e.deltaY < 0 ? 1.15 : 1 / 1.15))); if (z === 1) px = py = 0; apply(); }, { passive: false });
    stage.addEventListener("pointerdown", (e) => { drag = [e.clientX - px, e.clientY - py]; stage.setPointerCapture(e.pointerId); });
    stage.addEventListener("pointermove", (e) => { if (drag && z > 1) { px = e.clientX - drag[0]; py = e.clientY - drag[1]; apply(); } });
    stage.addEventListener("pointerup", () => (drag = null));
    vw.append(stage, el("p", "cap2", tx.caption));
    const tl = el("div", "vw-tools");
    const zo = el("button", "btn", "−"); zo.type = "button"; zo.setAttribute("aria-label", "zoom out"); zo.onclick = () => { z = Math.max(1, z / 1.3); if (z === 1) px = py = 0; apply(); };
    const zi = el("button", "btn", "+"); zi.type = "button"; zi.setAttribute("aria-label", "zoom in"); zi.onclick = () => { z = Math.min(6, z * 1.3); apply(); };
    const cmp = el("label"), cr = el("input"); cr.type = "range"; cr.min = 0; cr.max = 100; cr.value = 100; cr.oninput = () => { stage.style.setProperty("--cut", cr.value + "%"); line.hidden = +cr.value >= 100; }; cmp.append(document.createTextNode(t.compare), cr);
    const nw = el("label"), nc = el("input"); nc.type = "checkbox"; nc.onchange = () => { const c = nc.checked ? DMEngine.renderIllusDelta(S.an, S.il, i) : stepCanvas(i); const g = base.getContext("2d"); g.clearRect(0, 0, base.width, base.height); g.fillStyle = "#fbf8f1"; g.fillRect(0, 0, base.width, base.height); g.drawImage(c, 0, 0); }; nw.append(nc, document.createTextNode(t.newOnly)); if (i === 0) nw.hidden = true;
    const fs = el("button", "btn", "⛶ " + t.full); fs.type = "button"; fs.onclick = () => { if (stage.requestFullscreen) stage.requestFullscreen().catch(() => {}); };
    const dl = el("button", "btn red", "⬇ " + t.download); dl.type = "button"; dl.onclick = () => saveStep(i);
    const dn = el("label"), dc = el("input"); dc.type = "checkbox"; dc.checked = !!S.done[s.key]; dc.onchange = () => { S.done[s.key] = dc.checked; store.set("dm.done", S.done); renderPoster(); }; dn.append(dc, document.createTextNode(t.done));
    tl.append(zo, zi, cmp, nw, fs, dl, dn); vw.append(tl);
    const det = el("div", "det"); [["where", tx.where], ["how", tx.how], ["toolsW", tx.tools], ["avoid", tx.avoid]].forEach(([k, v]) => { if (!v) return; const p = el("p"); p.append(el("b", null, t[k] + ": "), document.createTextNode(v)); det.append(p); }); vw.append(det);
    back.append(vw); ov.append(back); pv.focus();
  }

  /* ---------- area order correction ---------- */
  function openFix() {
    const t = T(), ov = $("ovl"); ov.replaceChildren(); const back = el("div", "ov"), vw = el("div", "vw"); vw.dir = lang === "ar" ? "rtl" : "ltr";
    const close = () => { ov.replaceChildren(); Object.keys(cache).forEach((k) => delete cache[k]); renderPoster(); }; back.onclick = (e) => { if (e.target === back) close(); };
    const h = el("div", "vw-h"); h.append(el("h2", null, t.fix)); const cl = el("button", "btn", "✕"); cl.type = "button"; cl.onclick = close; h.append(cl); vw.append(h, el("p", "honest", t.fixHelp));
    let sel = null; const stage = el("div", "stage"); stage.style.cursor = "crosshair"; const list = el("div", "areas"); const acts = el("div", "vw-tools");
    const lastColor = () => { let k = 0; S.il.steps.forEach((s, j) => { if (kindOf(s) === "color") k = j; }); return k; };
    const paint = () => {
      stage.replaceChildren(stepCanvas(lastColor()));
      list.replaceChildren(...S.il.areas.slice().sort((a, b) => a.order - b.order).map((a, k) => { const b = el("button", "btn"); b.type = "button"; const sw = el("i"); sw.style.cssText = `width:14px;height:14px;border-radius:50%;display:inline-block;background:${a.hex}`; b.append(sw, document.createTextNode(`${k + 1}. ${(S.ai && S.ai.areas && S.ai.areas[a.id]) || a.position}`)); b.setAttribute("aria-pressed", String(sel === a)); b.onclick = () => { sel = a; paint(); }; return b; }));
      acts.replaceChildren(); const up = el("button", "btn", "↑ " + t.earlier), dn = el("button", "btn", "↓ " + t.later); up.type = dn.type = "button"; up.disabled = dn.disabled = !sel;
      up.onclick = () => { DMEngine.setAreaOrder(S.il, sel.id, sel.order - 1.5); paint(); }; dn.onclick = () => { DMEngine.setAreaOrder(S.il, sel.id, sel.order + 1.5); paint(); }; acts.append(up, dn);
    };
    stage.onclick = (e) => { const c = stage.querySelector("canvas"), r = c.getBoundingClientRect(); sel = DMEngine.areaAt(S.il, S.an, (e.clientX - r.left) * S.an.width / r.width, (e.clientY - r.top) * S.an.height / r.height); paint(); };
    paint(); vw.append(stage, list, acts); back.append(vw); ov.append(back);
  }

  /* ---------- downloads ---------- */
  async function saveCanvas(c, name) {
    const blob = await DMEngine.toBlob(c);
    const dl = window.claude && window.claude.use ? await window.claude.use("downloads").catch(() => null) : null;
    if (dl) return dl.save({ filename: name, data: blob });
    if (!window.claude) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 3000); }
  }
  const saveStep = (i) => saveCanvas(stepCanvas(i, 2), `drawmaster-step-${String(i + 1).padStart(2, "0")}.png`).catch(() => {});
  async function downloadAll() { for (let i = 0; i < S.il.steps.length; i++) { try { await saveStep(i); } catch { break; } } }

  /* ---------- Claude personalisation ---------- */
  function parseJson(text) {
    const tr = String(text).trim(), tries = [tr], f = tr.match(/```(?:json)?\s*([\s\S]*?)```/); if (f) tries.push(f[1]); const a = tr.indexOf("{"), b = tr.lastIndexOf("}"); if (a >= 0 && b > a) tries.push(tr.slice(a, b + 1));
    for (const c of tries) { try { return JSON.parse(c); } catch {} try { return JSON.parse(c.replace(/,\s*([}\]])/g, "$1")); } catch {} }
    throw new Error("json");
  }
  async function jpeg() { const im = new Image(); im.src = S.img; await im.decode(); const sc = Math.min(1, 1400 / Math.max(im.width, im.height)), c = document.createElement("canvas"); c.width = im.width * sc; c.height = im.height * sc; c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); return new Promise((r) => c.toBlob(r, "image/jpeg", 0.88)); }
  async function personalise() {
    if (!S.sample || !S.il) return;
    const ln = { ar: "Arabic", fr: "French", en: "English" }[lang], m = MODELS[S.model];
    const steps = S.il.steps.map((s) => ({ key: s.key, kind: kindOf(s), area: s.areaId }));
    const areas = S.il.areas.map((a) => ({ id: a.id, position: a.position, colour: a.colorName, hex: a.hex, bbox_pct: a.bbox_pct, area_pct: a.area_pct }));
    const prompt = `You are a warm drawing teacher writing a printed "how to draw" poster for this picture (coloured pencils). A program already computed the step images: ${JSON.stringify(steps)}. Areas (computed from the pixels): ${JSON.stringify(areas)}.
Name each area by what it really shows in the picture (e.g. "the sky", "the rocks on the left"). Then for each step write: title (2–4 words), caption (one simple line, ≤ 14 words), where, how, tools, avoid (each ≤ 10 words). Write in ${ln}. Simple, concrete, encouraging.
Reply ONLY JSON: {"title":"scene name, 2–4 words","areas":{"<areaId>":"name"},"steps":{"<step key>":{"title":"","caption":"","where":"","how":"","tools":"","avoid":""}},"materials":["4–6 items"],"colors":[{"hex":"#rrggbb","name":""}],"tips":["5 short pro secrets"],"note":"one encouraging line"}`;
    const P = $("poster"), st = el("div", "status"); st.append(el("span", "spin"), document.createTextNode(T().aiWorking)); P.prepend(st);
    let failed = false;
    try {
      const r = await S.sample(prompt, { model: m[0], modelTier: m[1], effort: ["low", "medium", "high"][S.effort], images: [await jpeg()], cache: false });
      const d = parseJson(r.text);
      S.ai = { title: String(d.title || "").slice(0, 60), areas: d.areas && typeof d.areas === "object" ? d.areas : {}, steps: d.steps && typeof d.steps === "object" ? d.steps : {},
        materials: (d.materials || []).map(String).slice(0, 7), colors: (d.colors || []).filter((c) => c && /^#[0-9a-f]{6}$/i.test(c.hex)).map((c) => ({ hex: c.hex, name: String(c.name || "").slice(0, 20) })).slice(0, 8),
        tips: (d.tips || []).map(String).slice(0, 5), note: String(d.note || "").slice(0, 120) };
      S.aiModel = r.modelApplied ? m[2] : ({ quick: "Haiku", default: "Sonnet", complex: "Opus" }[r.modelTierApplied] || m[2]);
    } catch (e) { failed = true; }
    st.remove(); renderPoster(); paintAI(); if (failed) $("poster").prepend(el("p", "honest", T().aiErr));
  }
  S.ready = (async () => { if (window.claude && window.claude.use) { try { S.sample = await window.claude.use("sample"); } catch { S.sample = null; } } paintAI(); })();
  applyLang();
  window.__dm = { S, openViewer, openFix, renderPoster };
})();
</script>
