<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Prof de Poche</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap">
<style>
/* Layout: sticky header with XP; main column = exercise stepper, statement, live geometry board on squared paper, step-by-step question card; right rail = AI tutor (bottom sheet on phones). Dark-first "blackboard" palette with chalk-yellow accent. */
:root {
  --bg: #0b0e14; --bg-2: #0f131b; --surface: #141923; --surface-2: #1a2030; --surface-3: #212839; --line: #262e40; --line-2: #313b52;
  --fg: #e9edf5; --muted: #8e99b0; --faint: #5f6a82;
  --accent: #f7c548; --accent-ink: #1b1505; --accent-soft: #2b2512;
  --red: #ff5c5c; --blue: #5ea1ff; --green: #3fd28c; --purple: #a682ff; --orange: #ff9f45; --pink: #ff6fae; --teal: #36d1c4;
  --ok: #3fd28c; --ok-soft: #12291f; --bad: #ff6b6b; --bad-soft: #2e1618; --warn: #ffb547; --warn-soft: #2d2312;
  --paper: #10151f; --grid: #182031; --grid-strong: #1f293c;
  --font-display: "Bricolage Grotesque", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --radius: 16px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f3f5fa; --bg-2: #eceff6; --surface: #ffffff; --surface-2: #f2f4f9; --surface-3: #e8ecf4; --line: #dce2ec; --line-2: #c9d1df;
    --fg: #131925; --muted: #586378; --faint: #8a93a7;
    --accent: #a86f00; --accent-ink: #ffffff; --accent-soft: #fbf1db;
    --red: #dc3b3b; --blue: #2d6ee0; --green: #18925a; --purple: #7547de; --orange: #d9700f; --pink: #cf3580; --teal: #0e9488;
    --ok: #18925a; --ok-soft: #e3f5ec; --bad: #d23c3c; --bad-soft: #fbe9e9; --warn: #b7770a; --warn-soft: #fbf1dc;
    --paper: #fbfcfe; --grid: #eaeef5; --grid-strong: #dbe2ee;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f3f5fa; --bg-2: #eceff6; --surface: #ffffff; --surface-2: #f2f4f9; --surface-3: #e8ecf4; --line: #dce2ec; --line-2: #c9d1df;
  --fg: #131925; --muted: #586378; --faint: #8a93a7;
  --accent: #a86f00; --accent-ink: #ffffff; --accent-soft: #fbf1db;
  --red: #dc3b3b; --blue: #2d6ee0; --green: #18925a; --purple: #7547de; --orange: #d9700f; --pink: #cf3580; --teal: #0e9488;
  --ok: #18925a; --ok-soft: #e3f5ec; --bad: #d23c3c; --bad-soft: #fbe9e9; --warn: #b7770a; --warn-soft: #fbf1dc;
  --paper: #fbfcfe; --grid: #eaeef5; --grid-strong: #dbe2ee;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--font-body); font-size: 15.5px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
h1, h2, h3, h4 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
svg.i { width: 1em; height: 1em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1320px; margin: 0 auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1 1 260px; }
.badge-sub { width: 42px; height: 42px; border-radius: 11px; background: var(--red); color: #fff; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 10.5px; letter-spacing: 0; flex: none; line-height: 1.05; text-align: center; overflow: hidden; }
.brand-t { min-width: 0; }
.brand-t h1 { font-size: 18px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brand-t p { margin: 0; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.xp { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 4px 12px 4px 6px; font-size: 13px; }
.xp .lvl { background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 1px 8px; font-weight: 700; font-family: var(--font-mono); font-size: 12px; }
.xp .bar { width: 64px; height: 6px; background: var(--surface-3); border-radius: 99px; overflow: hidden; }
.xp .bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s; }
.xp .name { color: var(--muted); max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.streak { color: var(--orange); font-weight: 700; font-family: var(--font-mono); }
.iconbtn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); display: grid; place-items: center; font-size: 17px; color: var(--fg); }
.iconbtn:hover { border-color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 6px 10px; font-size: 12.5px; font-weight: 700; color: var(--muted); }
.seg button + button { border-inline-start: 1px solid var(--line-2); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }

/* layout */
.shell { max-width: 1320px; margin: 0 auto; padding-block: 18px 90px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.shell { max-width: 820px; }
.main { display: grid; gap: 14px; min-width: 0; grid-template-columns: minmax(0, 1fr); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; }
.pad { padding: 16px 18px; }

.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.toolbar .grp { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; min-width: 0; }
.select { border: 1px solid var(--line-2); background: var(--surface); border-radius: 10px; padding: 7px 10px; max-width: 260px; }
.btn { border: 1px solid var(--line-2); background: var(--surface); border-radius: 11px; padding: 8px 14px; display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; color: var(--fg); white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.btn.accent { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ai { background: linear-gradient(135deg, color-mix(in srgb, var(--purple) 22%, var(--surface)), color-mix(in srgb, var(--blue) 18%, var(--surface))); border-color: color-mix(in srgb, var(--purple) 55%, var(--line-2)); }
.btn.sm { padding: 5px 10px; font-size: 13px; border-radius: 9px; }
.btn.ghost { background: transparent; }
.spark { color: var(--purple); }

/* exercise tabs */
.tabs { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(120px, 1fr); gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.tab { justify-content: center; min-width: 0; border: 1px solid var(--line-2); background: var(--surface); border-radius: 12px; padding: 8px 14px; font-weight: 700; font-size: 14px; color: var(--muted); display: inline-flex; gap: 8px; align-items: center; }
.tab[aria-selected="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.tab .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line-2); }
.tab .dot.part { background: var(--warn); }
.tab .dot.full { background: var(--ok); }
.tab .ai-tag { font-size: 11px; color: var(--purple); }
.tab[aria-selected="true"] .ai-tag { color: inherit; }

/* question nav */
.qnav { display: grid; gap: 10px; }
.qnav-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.qnav-top h2 { font-size: 15px; }
.qnav-top .pct { font-size: 13px; color: var(--muted); }
.segs { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; }
.segs button { height: 30px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface-2); color: var(--muted); font-family: var(--font-mono); font-weight: 700; font-size: 13px; }
.segs button.done { background: color-mix(in srgb, var(--ok) 22%, var(--surface-2)); color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, var(--line-2)); }
.segs button[aria-current="true"] { background: var(--red); color: #fff; border-color: var(--red); }
.navbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.navbtns .btn { justify-content: center; }

/* statement */
.statement summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.statement summary::-webkit-details-marker { display: none; }
.statement h3 { font-size: 16px; }
.ex-name { color: var(--muted); font-size: 13px; font-weight: 400; font-family: var(--font-body); }
.stmt { margin-top: 10px; font-size: 15.5px; }
.stmt-qs { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.stmt-qs button { width: 100%; text-align: start; border: 1px solid transparent; background: var(--surface-2); border-radius: 10px; padding: 7px 10px; display: flex; gap: 10px; align-items: baseline; color: var(--fg); }
.stmt-qs button:hover { border-color: var(--line-2); }
.stmt-qs .lbl { font-family: var(--font-mono); font-weight: 700; color: var(--accent); flex: none; }
.chev { transition: transform .2s; color: var(--muted); }
details[open] > summary .chev { transform: rotate(180deg); }

/* board */
.board-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; padding: 12px 14px 0; }
.board-head h3 { font-size: 15px; }
.board-tools { display: flex; gap: 6px; flex-wrap: wrap; }
.tog { border: 1px solid var(--line-2); background: var(--surface-2); border-radius: 9px; padding: 4px 10px; font-size: 12.5px; font-weight: 700; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.tog[aria-pressed="true"] { color: var(--fg); border-color: var(--fg); }
.board { position: relative; margin: 10px 14px 0; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--paper); }
.board svg.fig { display: block; width: 100%; height: auto; touch-action: none; user-select: none; -webkit-user-select: none; }
.board .note { position: absolute; inset-inline-start: 12px; top: 10px; max-width: calc(100% - 24px); font-family: var(--font-display); font-weight: 700; font-size: 16px; color: var(--fg); background: color-mix(in srgb, var(--paper) 80%, transparent); padding: 2px 8px; border-radius: 8px; pointer-events: none; }
.board .static svg { width: 100%; height: auto; display: block; }
.checks { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 14px 0; }
.chk { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 3px 12px; font-size: 13px; font-weight: 700; background: var(--ok-soft); color: var(--ok); border: 1px solid color-mix(in srgb, var(--ok) 40%, transparent); }
.chk .mono { font-weight: 500; opacity: .8; font-size: 11.5px; }
.board-foot { padding: 8px 14px 14px; color: var(--muted); font-size: 12.5px; }
.fig .gl { stroke: var(--grid); stroke-width: 1; }
.fig .gl.s { stroke: var(--grid-strong); }
.fig .seg { stroke: var(--muted); stroke-width: 1.6; fill: none; }
.fig .poly { fill: color-mix(in srgb, var(--blue) 9%, transparent); stroke: var(--muted); stroke-width: 1.6; }
.fig .ln { stroke: var(--faint); stroke-width: 1.4; stroke-dasharray: 6 5; fill: none; }
.fig .ln.hl { stroke: var(--accent); stroke-width: 1.8; }
.fig .pt { fill: var(--fg); stroke: var(--paper); stroke-width: 2; }
.fig .pt.base { fill: var(--accent); stroke: var(--paper); cursor: grab; }
.fig .pt.base.drag { cursor: grabbing; }
.fig .halo { fill: var(--accent); opacity: .18; cursor: grab; }
.fig .plbl { fill: var(--fg); font-family: var(--font-display); font-weight: 700; font-size: 17px; paint-order: stroke; stroke: var(--paper); stroke-width: 4px; stroke-linejoin: round; }
.fig .vec { stroke-width: 3.4; fill: none; stroke-linecap: round; }
.fig .vlbl { font-family: var(--font-display); font-weight: 800; font-size: 15px; paint-order: stroke; stroke: var(--paper); stroke-width: 4px; stroke-linejoin: round; }
.fig .draw { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw .7s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.c-blue { stroke: var(--blue); fill: var(--blue); color: var(--blue); }
.c-green { stroke: var(--green); fill: var(--green); color: var(--green); }
.c-orange { stroke: var(--orange); fill: var(--orange); color: var(--orange); }
.c-purple { stroke: var(--purple); fill: var(--purple); color: var(--purple); }
.c-red { stroke: var(--red); fill: var(--red); color: var(--red); }
.c-pink { stroke: var(--pink); fill: var(--pink); color: var(--pink); }
.c-teal { stroke: var(--teal); fill: var(--teal); color: var(--teal); }
.c-amber { stroke: var(--accent); fill: var(--accent); color: var(--accent); }
.fig path.vec { fill: none; }

/* question */
.q-head { display: grid; gap: 6px; }
.q-head .q-lbl { font-family: var(--font-mono); font-size: 12.5px; color: var(--accent); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.q-head h3 { font-size: 19px; line-height: 1.35; }
.goal { color: var(--muted); font-size: 14.5px; margin: 0; }
.goal b { color: var(--fg); }
.steps { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 10px; }
.step { border: 1px solid var(--line); background: var(--surface-2); border-radius: 13px; padding: 11px 13px; display: grid; gap: 8px; animation: pop .35s ease-out; }
.step.active { border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 14%, transparent); }
@keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.step-row { display: flex; gap: 11px; align-items: flex-start; }
.step-n { width: 26px; height: 26px; border-radius: 8px; background: var(--surface-3); color: var(--fg); display: grid; place-items: center; font-family: var(--font-mono); font-weight: 700; font-size: 13px; flex: none; margin-top: 1px; }
.step.active .step-n { background: var(--accent); color: var(--accent-ink); }
.step-body { min-width: 0; flex: 1; overflow-wrap: anywhere; }
.step-tools { display: flex; gap: 6px; flex-wrap: wrap; padding-inline-start: 37px; }
.mini { border: 1px solid var(--line-2); background: var(--surface); border-radius: 8px; padding: 3px 9px; font-size: 12.5px; font-weight: 700; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.mini:hover { color: var(--fg); border-color: var(--fg); }
.mini.ai { color: var(--purple); border-color: color-mix(in srgb, var(--purple) 45%, var(--line-2)); }
.menu { display: flex; gap: 6px; flex-wrap: wrap; padding-inline-start: 37px; }
.aibox { margin-inline-start: 37px; border-radius: 11px; padding: 10px 12px; background: color-mix(in srgb, var(--purple) 10%, var(--surface)); border: 1px solid color-mix(in srgb, var(--purple) 35%, var(--line)); font-size: 14.5px; overflow-wrap: anywhere; }
.aibox .meta { font-size: 11.5px; color: var(--muted); margin-top: 6px; font-family: var(--font-mono); }
.step-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.qdone { margin-top: 12px; display: flex; gap: 10px; align-items: center; color: var(--ok); font-weight: 700; }
.actbar { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; margin-top: 14px; }
.actbar .btn { justify-content: center; }
.panel { margin-top: 12px; border-radius: 13px; padding: 13px 14px; border: 1px solid var(--line); background: var(--surface-2); display: grid; gap: 10px; animation: pop .3s ease-out; }
.panel h4 { font-size: 15px; display: flex; gap: 8px; align-items: center; }
.panel.hint { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
.panel.hint h4 { color: var(--warn); }
.quiz-q { font-weight: 700; }
.opts { display: grid; gap: 8px; }
.opt { text-align: start; border: 1px solid var(--line-2); background: var(--surface); border-radius: 11px; padding: 9px 12px; display: flex; gap: 10px; align-items: center; color: var(--fg); }
.opt .k { width: 24px; height: 24px; border-radius: 7px; background: var(--surface-3); display: grid; place-items: center; font-family: var(--font-mono); font-weight: 700; font-size: 12px; flex: none; }
.opt:hover:not(:disabled) { border-color: var(--fg); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .k { background: var(--ok); color: var(--bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .k { background: var(--bad); color: var(--bg); }
.why { font-size: 14px; color: var(--muted); }
.why b { color: var(--fg); }
.verify textarea { width: 100%; min-height: 110px; resize: vertical; border: 1px solid var(--line-2); background: var(--surface); border-radius: 11px; padding: 10px 12px; line-height: 1.6; }
.thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
.thumb { position: relative; width: 70px; height: 86px; border-radius: 9px; overflow: hidden; border: 1px solid var(--line-2); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb button { position: absolute; top: 3px; inset-inline-end: 3px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: rgb(0 0 0 / .65); color: #fff; font-size: 12px; }
.verdict { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: center; }
.ring { width: 70px; height: 70px; }
.ring circle { fill: none; stroke-width: 7; }
.ring .bg { stroke: var(--surface-3); }
.ring .fg { stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset .8s; }
.ring text { font-family: var(--font-mono); font-weight: 700; font-size: 17px; fill: var(--fg); }
.v-correct .ring .fg { stroke: var(--ok); } .v-partial .ring .fg { stroke: var(--warn); } .v-wrong .ring .fg { stroke: var(--bad); }
.verdict h4 { font-size: 16px; }
.v-correct h4 { color: var(--ok); } .v-partial h4 { color: var(--warn); } .v-wrong h4 { color: var(--bad); }
.errs { margin: 0; padding-inline-start: 20px; display: grid; gap: 6px; font-size: 14.5px; }
.errs b { color: var(--bad); }

/* tutor */
.tutor { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0; overflow: hidden; position: fixed; z-index: 40; transition: transform .28s ease; box-shadow: 0 -12px 50px rgb(0 0 0 / .45); }
@media (min-width: 760px) { .tutor { inset: 0 0 0 auto; width: min(420px, 100%); border-radius: 0; border-width: 0 0 0 1px; transform: translateX(105%); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); } [dir="rtl"] .tutor { inset: 0 auto 0 0; transform: translateX(-105%); } }
.tutor-head { padding: 13px 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tutor-head h2 { font-size: 16px; display: flex; align-items: center; gap: 8px; }
.avatar { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, var(--purple), var(--blue)); display: grid; place-items: center; color: #fff; font-size: 15px; }

      S.gen.seriesId = sr.id;
      stages[1].state = "ok"; stages[1].note = `${sr.title} · ${t("exCount", { n: stubs.length })}`; stages[2].state = "run"; stages[2].note = `0/${stubs.length}`; cur = 2; setStages(stages);
      S.mk.files = []; $("mkText").value = "";
      let k = 0; const queue = sr.exercises.map((_, i) => i);
      const worker = async () => { while (queue.length) { const i = queue.shift(); S.gen && S.gen.solving.add(i); setStages(stages); await solveOne(sr, i); S.gen && S.gen.solving.delete(i); k++; stages[2].note = `${k}/${stubs.length}`; setStages(stages); } };
      await Promise.all([worker(), worker()]);
      stages[2].state = "ok"; setStages(stages); confetti();
    } catch (e) { stages[cur].state = "err"; stages[cur].note = errText(e); setStages(stages); if (S.view !== "home") toast(errText(e)); }
    finally { S.mk.busy = false; $("mkGo").disabled = false; if (S.view === "home") renderGen(); }
  }
  async function solveOne(sr, i) {
    const stub = sr.exercises[i]; if (!stub) return;
    const base = stub.pending || stub.error ? stub : stubFrom({ ...stub, questions: stub.questions }, i);
    base.pending = true; base.error = ""; sr.exercises[i] = base; refreshEx(sr, i, false);
    try {
      const src = S.src[sr.id] || { images: [], text: "" };
      const needImg = src.images.length && (src.images.length <= 3 || /figure|schéma|schema|ci-contre|graphique|tableau|courbe|الشكل|الرسم|المبيان|diagram|table/i.test(base.statement + " " + base.figureHint));
      const data = await ai(solvePrompt(sr, base), { json: true, images: needImg ? src.images : [] });
      const x = normEx({ ...data, title: data.title || base.title, name: data.name || base.name, statement: data.statement || base.statement }, i);
      if (!x) throw { code: "bad_shape" };
      x.id = base.id; sr.exercises[i] = x; saveLibrary(); refreshEx(sr, i, true);
    } catch (e) { base.pending = false; base.error = errText(e); saveLibrary(); refreshEx(sr, i, false); }
  }
  function refreshEx(sr, i, ready) {
    if (S.view !== "study" || S.seriesId !== sr.id) { if (S.view === "home") { renderLibrary(); renderGen(); } return; }
    if (S.exIdx === i) renderAll(); else renderTabs();
    if (ready) toast(t("exReady", { name: sr.exercises[i].title }));
  }
  async function regenCurrent() {
    const sr = S.library.find((x) => x.id === S.seriesId); if (!sr) return;
    const i = S.exIdx; if (i >= sr.exercises.length) return;
    const e = sr.exercises[i]; sr.exercises[i] = stubFrom({ id: e.id, title: e.title, name: e.name, statement: e.statement, figureHint: e.figureHint, questions: e.questions }, i);
    S.revealed = {}; renderAll(); await solveOne(sr, i);
  }
  function openSeries(id) { S.seriesId = id; store.set("pdp.series", id); S.exIdx = 0; S.qIdx = 0; S.panel = null; setView("study"); }
  function setView(v) {
    S.view = v; $("home").hidden = v !== "home"; $("app").hidden = v !== "study"; $("fab").hidden = v !== "study";
    window.scrollTo(0, 0);
    if (v === "home") { applyUiText(); renderHeader(); renderHome(); } else renderAll();
  }
  function seriesProgress(sr) { let d = 0, n = 0; sr.exercises.forEach((e) => (e.questions || []).forEach((_, i) => { n++; if (S.progress.done[`${sr.id}|${e.id}|${i}`]) d++; })); return { d, n }; }
  function renderLibrary() {
    const grid = $("libGrid"); grid.replaceChildren();
    allSeries().forEach((sr) => {
      const c = el("div", "scard"); const top = el("div", "scard-top"); const bd = el("div", "badge-sub"); setBadge(bd, sr.badge || sr.subject);
      const tt = el("div"); tt.style.minWidth = "0"; tt.append(el("h4", null, sr.title), el("div", "sub", sr.subtitle || "")); top.append(bd, tt); c.append(top);
      const { d, n } = seriesProgress(sr); const meter = el("div", "meter"); const fill = el("i"); fill.style.width = (n ? (d / n) * 100 : 0) + "%"; meter.append(fill); c.append(meter);
      const row = el("div", "row"); const info = el("span", null, `${t("exCount", { n: sr.exercises.length })} · ${t("qsCount", { n })}`); row.append(info);
      if (sr.builtin) row.append(el("span", "ex-tag", t("exampleTag")));
      else if (sr.exercises.some((e) => e.pending)) row.append(el("span", "spin"));
      c.append(row);
      const acts = el("div", "mk-row"); const o = el("button", "btn sm primary", t("open")); o.type = "button"; o.onclick = () => openSeries(sr.id); acts.append(o);
      if (!sr.builtin) { const del = el("button", "btn sm ghost", "✕"); del.type = "button"; del.setAttribute("aria-label", t("deleteSeries")); del.onclick = () => { if (del.dataset.armed) { S.library = S.library.filter((x) => x.id !== sr.id); delete S.extra[sr.id]; store.set("pdp.extra", S.extra); saveLibrary(); renderLibrary(); } else { del.dataset.armed = "1"; del.textContent = t("confirmDel"); } }; acts.append(del); }
      c.append(acts); grid.append(c);
    });
  }
  function renderHome() {
    const h = $("heroTitle"); h.replaceChildren(document.createTextNode(t("heroA")), el("em", null, t("heroB")));
    const flow = $("flow"); flow.replaceChildren(); ["flow1", "flow2", "flow3", "flow4"].forEach((k, i) => { if (i) flow.append(el("b", null, ui === "ar" ? "←" : "→")); flow.append(el("span", null, t(k))); });
    const lv = $("mkLevel"), lvVal = lv.value || "auto"; lv.replaceChildren(...LEVELS.map(([v, k]) => { const o = el("option", null, t(k)); o.value = v; return o; })); lv.value = lvVal;
    const lg = $("mkLang"), lgVal = lg.value || "auto"; lg.replaceChildren(...[["auto", "plAuto"], ["fr", "lFr"], ["ar", "lAr"], ["en", "lEn"]].map(([v, k]) => { const o = el("option", null, t(k)); o.value = v; return o; })); lg.value = lgVal;
    const seg = $("mkModel"); seg.replaceChildren(...Object.entries(MODELS).map(([k, m]) => { const b = el("button", null, m.name); b.type = "button"; b.setAttribute("aria-pressed", String(S.settings.model === k)); b.onclick = () => { S.settings.model = k; saveSettings(); renderHome(); $("modelChip").textContent = modelName(); }; return b; }));
    $("mkModelNote").textContent = t((MODELS[S.settings.model] || MODELS.haiku).desc);
    $("mkEffort").value = String(S.settings.effort); $("mkEffortLbl").textContent = t(EFF_KEYS[S.settings.effort]);
    $("mkFiles").replaceChildren(...S.mk.files.map((f, i) => pageCard(/^image\//.test(f.type) ? f._url || (f._url = URL.createObjectURL(f)) : "", /^image\//.test(f.type) ? `${t("page")} ${i + 1}` : f.name, { ext: (f.name.split(".").pop() || "").toUpperCase().slice(0, 4), onRemove: () => { S.mk.files.splice(i, 1); renderHome(); } })));
    renderGen(); renderLibrary();
  }
  const addMk = (list) => { S.mk.files.push(...Array.from(list || []).slice(0, 20)); renderHome(); };
  $("mkPick").onclick = () => $("mkFile").click(); $("mkCam").onclick = () => $("mkCamIn").click();
  $("mkFile").onchange = (e) => { addMk(e.target.files); e.target.value = ""; }; $("mkCamIn").onchange = (e) => { addMk(e.target.files); e.target.value = ""; };
  ["dragenter", "dragover"].forEach((ev) => $("mkDrop").addEventListener(ev, (e) => { e.preventDefault(); $("mkDrop").classList.add("over"); }));
  ["dragleave", "drop"].forEach((ev) => $("mkDrop").addEventListener(ev, (e) => { e.preventDefault(); $("mkDrop").classList.remove("over"); }));
  $("mkDrop").addEventListener("drop", (e) => addMk(e.dataTransfer && e.dataTransfer.files));
  document.addEventListener("paste", (e) => { if (S.view !== "home") return; const fl = Array.from((e.clipboardData && e.clipboardData.items) || []).filter((it) => it.kind === "file").map((it) => it.getAsFile()).filter(Boolean); if (fl.length) { e.preventDefault(); addMk(fl); } });
  $("mkEffort").addEventListener("input", (e) => { S.settings.effort = +e.target.value; saveSettings(); $("mkEffortLbl").textContent = t(EFF_KEYS[S.settings.effort]); $("modelChip").textContent = modelName(); });
  $("mkGo").onclick = makeSeries;
  async function makeSimilar() {
    toast(t("simBuilding"));
    try {
      const e = ex(); const src = JSON.stringify({ title: e.title, statement: e.statement, figure: e.figure && e.figure.base ? e.figure : null, questions: e.questions.map((q) => ({ label: q.label, title: q.title, steps: q.steps.map((s) => s.text) })) });
      const data = await ai(`Create ONE new exercise of the same type and difficulty as this one, with different points/coefficients so the student can practise the same method. Solve it fully and correctly; double-check every vector computation. Keep the language "${series().lang}". Give it a fun nickname.\nOriginal exercise:\n${src}\n${EX_SCHEMA}\nReply ONLY with the Exercise JSON.`, { json: true });
      const x = normEx(data, series().exercises.length);
      if (!x) throw { code: "bad_shape" };
      x.ai = true; x.title = `${x.title.replace(/\s*✦$/, "")}`;
      const list = S.extra[S.seriesId] || []; list.push(x); S.extra[S.seriesId] = list.slice(-6); store.set("pdp.extra", S.extra);
      S.exIdx = series().exercises.length - 1; S.qIdx = 0; renderAll(); toast(t("simDone"));
    } catch (er) { toast(errText(er)); }
  }

  /* ============ Theme, language, wiring ============ */
  function applyTheme() {
    const th = S.settings.theme; if (th) document.documentElement.dataset.theme = th; else delete document.documentElement.dataset.theme;
  }
  $("settingsBtn").onclick = openSettings;
  $("homeBtn").onclick = () => setView("home");
  document.addEventListener("keydown", (e) => {
    if (S.view !== "study" || e.target.closest("input, textarea, select") || $("overlay").childElementCount) return;
    if (e.key === "ArrowRight") goQ(S.qIdx + (ui === "ar" ? -1 : 1));
    if (e.key === "ArrowLeft") goQ(S.qIdx + (ui === "ar" ? 1 : -1));
  });
  function applyUiText() {
    document.documentElement.lang = ui; $("app").dir = ui === "ar" ? "rtl" : "ltr"; document.querySelector(".top-in").dir = ui === "ar" ? "rtl" : "ltr";
    document.querySelectorAll("[data-t]").forEach((n) => { n.textContent = t(n.dataset.t); });
    document.querySelectorAll("[data-tp]").forEach((n) => { n.placeholder = t(n.dataset.tp); });
    $("modelChip").textContent = lastServed || modelName();
  }
  function renderAll() {
    if (S.view === "home") { applyUiText(); renderHeader(); renderHome(); return; }
    if (S.exIdx >= series().exercises.length) S.exIdx = 0;
    applyUiText(); renderHeader(); renderTabs(); renderNav(); renderStatement(); renderBoard(); renderQuestion(); renderChips();
  }

  let backendReady;
  async function detectBackend() {
    if (window.claude && typeof window.claude.use === "function") {
      let sample = null; try { sample = await window.claude.use("sample"); } catch {}
      if (sample) { S.backend = "claude"; S.sample = sample; try { const lim = await sample.limits(); S.imagesOk = !!(lim && lim.images); if (lim && lim.images) S.maxImages = lim.images.maxCount || 10; } catch {} }
      else S.backend = "none";
    } else S.backend = "api";
    if (S.backend !== "claude") renderQuestion();
  }

  /* ============ Boot ============ */
  const savedUi = store.get("pdp.ui", ""); ui = ULANGS.includes(savedUi) ? savedUi : ((navigator.language || "").startsWith("ar") ? "ar" : (navigator.language || "").startsWith("en") ? "en" : "fr");
  if (!allSeries().some((s) => s.id === S.seriesId)) S.seriesId = SERIES1.id;
  applyTheme(); setView("home"); renderLogIntro();
  backendReady = detectBackend();
  window.__pdp = { S, computeFigure, runCheck, normEx, parseJsonLoose, series, goQ, renderAll, SERIES1, compileExpr, setView, openSeries };
})();
</script>
